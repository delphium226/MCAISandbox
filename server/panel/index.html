}
// ---- #67: utilisation, the busy share over time as the runs' "busy %" counts it (an action running), from /api/utilisation ----
const UTIL_SPANS = [[1, 'last hour'], [6, '6 hours'], [24, '24 hours']];
let util = null;
let utilBin = Number(store.get('panel.utilBin', 1)) || 1;
async function refreshUtil() {
  if (paused) return;
  try { util = await api(`/api/utilisation?bin=${utilBin}&points=60`); } catch { util = null; }
}
/** Per point, the mean of the rows' shares that are not null (members seen alike: the village's busy share). */
function utilMean(rows) {
  if (!rows.length) return [];
  return rows[0].map((_, i) => {
    const xs = rows.map((r) => r[i]).filter((x) => x != null);
    return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
  });
}
/** The share over the series' seen points (null when none). */
function utilAvg(series) {
  const xs = series.filter((x) => x != null);
  return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
}
/** An area chart of shares 0..1, gaps where nothing was seen. */
function utilSvg(series, w, h, cls) {
  const n = series.length;
  if (!n) return '';
  const x = (i) => (n === 1 ? w / 2 : (i * w) / (n - 1)), y = (v) => h - v * h;
  let d = '', run = [];
  const flush = () => {
    if (!run.length) return;
    const pts = run.map(([i, v]) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    d += `M${x(run[0][0]).toFixed(1)},${h} L${pts.join(' L')} L${x(run[run.length - 1][0]).toFixed(1)},${h} Z `;
    run = [];
  };
  series.forEach((v, i) => (v == null ? flush() : run.push([i, Math.max(0, Math.min(1, v))])));
  flush();
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="busy share over time">
    <line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" class="util-grid"/><path d="${d}" class="util-area"/></svg>`;
}
const pctText = (v) => (v == null ? 'n/a' : `${Math.round(100 * v)}%`);
/** The simple view's card: the village's members busy over time, with the span chips. */
function utilCard(names) {
  if (!util) return '';
  const rows = names.map((n) => util.agents[n]).filter(Boolean);
  if (!rows.length) return '';
  const series = utilMean(rows);
  const span = UTIL_SPANS.find(([b]) => b === util.binMin)?.[1] || `${util.binMin * 60} min`;
  const chips = UTIL_SPANS.map(([b, label]) => `<button class="chip${b === utilBin ? ' on' : ''}" data-utilbin="${b}">${label}</button>`).join('');
  return `<div class="card"><div class="label">How busy the members are</div>
    <div class="util-head"><b>${pctText(utilAvg(series))}</b> <span class="sub">busy over the ${esc(span)} (an action running; ${util.binMin} min a point)</span><span class="spacer"></span>${chips}</div>
    ${utilSvg(series, 600, 80, 'util-chart')}
    <div class="util-axis sub"><span>${new Date(util.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span><span>now</span></div></div>`;
}
/** The detailed view's line in an agent's card: its busy share over time. */
function utilLine(name) {
  const row = util?.agents?.[name];
  if (!row) return '';
  return `<div class="util-line"><span class="sub">busy ${pctText(utilAvg(row))} over ${util.binMin * 60 >= 120 ? `${util.binMin} h` : 'the last hour'}</span>${utilSvg(row, 240, 24, 'util-spark')}</div>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest?.('[data-utilbin]');
  if (!b) return;
  utilBin = Number(b.dataset.utilbin) || 1;
  store.set('panel.utilBin', utilBin);
  refreshUtil().then(() => lastData && render(lastData));
});
// ---- the whole tech tree (techTree.ts via /api/techtree): goods by recipe depth, coloured by what the village has ----
let techtrees = null;
async function refreshTechTrees() {
  if (paused) return;
  try { techtrees = await api('/api/techtree'); } catch { techtrees = null; }
}
const TREE_STATES = {
  made: ['made', 'var(--good)', 'solid'], unlocked: ['invented', 'var(--good)', 'solid'], researching: ['being researched', 'var(--warn)', 'solid'],
  known: ['known, never made', 'var(--accent)', 'outline'], locked: ['locked', 'var(--muted)', 'dashed'], raw: ['raw material', 'var(--text)', 'outline'],
};
/** Columns by recipe depth (raw materials left), each node coloured by its state; inventions drawn as pills. */
function techTreeSvg(t) {
  if (!t || !t.nodes.length) return '';
  const W = 138, H = 18, COL = 164, ROW = 23, PAD = 6;
  const cols = [];
  for (const n of t.nodes) (cols[n.depth] ||= []).push(n);
  const order = ['raw', 'unlocked', 'researching', 'made', 'known', 'locked'];
  const pos = new Map();
  cols.forEach((c, d) => (c || []).sort((a, b) => (a.kind === 'invention') - (b.kind === 'invention') || order.indexOf(a.state) - order.indexOf(b.state) || a.label.localeCompare(b.label))
    .forEach((n, i) => pos.set(n.id, { x: PAD + d * COL, y: PAD + 16 + i * ROW, n })));
  const width = PAD * 2 + (cols.length - 1) * COL + W, height = PAD * 2 + 16 + Math.max(...cols.map((c) => (c || []).length)) * ROW;
  const edges = t.edges.map(([a, b]) => {
    const p = pos.get(a), q = pos.get(b);
    if (!p || !q) return '';
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x, y2 = q.y + H / 2, mx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="var(--muted)" stroke-width="1"${q.n.state === 'locked' ? ' stroke-dasharray="3 3" opacity="0.3"' : ' opacity="0.45"'}/>`;
  }).join('');
  const nodes = [...pos.values()].map(({ x, y, n }) => {
    const [word, c, style] = TREE_STATES[n.state] || TREE_STATES.known;
    const fill = style === 'solid' ? `color-mix(in srgb, ${c} 28%, var(--panel))` : 'var(--panel)';
    const ins = t.edges.filter(([, b]) => b === n.id).map(([a]) => pos.get(a)?.n.label).filter(Boolean);
    const label = n.label.length > 19 ? `${n.label.slice(0, 18)}…` : n.label;
    return `<g><title>${esc(n.label)}: ${esc(word)}${n.how ? ` (${n.how})` : ''}${ins.length ? `; from ${esc(ins.join(', '))}` : ''}</title>`
      + `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="${n.kind === 'invention' ? 9 : 3}" fill="${fill}" stroke="${c}" stroke-width="${n.kind === 'invention' ? 1.6 : 1}"${style === 'dashed' ? ' stroke-dasharray="3 2"' : ''}/>`
      + `<text x="${x + W / 2}" y="${y + H / 2 + 4}" text-anchor="middle" font-size="11" fill="var(--text)"${n.kind === 'invention' ? ' font-weight="600"' : ''}${n.state === 'locked' ? ' opacity="0.65"' : ''}>${esc(label)}</text></g>`;
  }).join('');
  const heads = cols.map((_, d) => `<text x="${PAD + d * COL + W / 2}" y="${PAD + 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d ? `step ${d}` : 'raw'}</text>`).join('');
  const counts = {};
  for (const n of t.nodes) counts[n.state] = (counts[n.state] || 0) + 1;
  const legend = Object.entries(TREE_STATES).filter(([k]) => counts[k]).map(([k, [word, c, style]]) => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px"><span style="display:inline-block;width:12px;height:10px;border-radius:2px;border:1px ${style === 'dashed' ? 'dashed' : 'solid'} ${c};background:${style === 'solid' ? `color-mix(in srgb, ${c} 28%, var(--panel))` : 'transparent'}"></span>${esc(word)} ${counts[k]}</span>`).join('');
  return `<div class="label">Tech tree</div><div class="sub" style="margin:2px 0 6px">${legend}<span>pills are the library's inventions; hover a box for its recipe</span></div>
    <div style="overflow-x:auto;margin-bottom:8px"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="the village's tech tree">${heads}${edges}${nodes}</svg></div>`;
}
// ---- #80: the thriving scorecard (scripts/scorecard.py's measures and pass mark), from /api/scorecard ----
let scorecard = null;
async function refreshScorecard() {
  if (paused) return;
  try { scorecard = await api('/api/scorecard'); } catch { scorecard = null; }
}
/** The measures shown: label, the point's field, a counter (added per bin) or a level, how a value reads. */
const SCORE_ROWS = [
  ['busy %', 'busy', false, (x) => `${x}`], ['needs met', 'needsMet', false, (x) => x.toFixed(2)], ['houses', 'houses', false, (x) => `${x}`],
  ['goods / member', 'goodsPerMember', false, (x) => `${Math.round(x)}`], ['kinds in storage', 'kinds', false, (x) => `${Math.round(x)}`],
  ['works built', 'works', true, (x) => `${x}`], ['public works', 'publicWorks', true, (x) => `${x}`], ['barter trades', 'trades', true, (x) => `${x}`], ['merchant emeralds', 'emeralds', true, (x) => `${x}`],
  ['inventions', 'techniques', true, (x) => `${x}`], ['road cells', 'roads', false, (x) => `${x}`],
];
/** Last hour against hour 1, as scripts/scorecard.py words it (the pass mark's yardstick). */
function scoreTrend(hours, f) {
  if (hours.length < 3) return '';
  const h1 = hours[0][f], last = hours[hours.length - 1][f];
  if (h1 == null || last == null) return '';
  if (h1 === 0) return last === 0 ? 'none' : 'rising';
  const r = last / h1;
  return `${r < 0.5 ? 'collapsed' : r < 0.9 ? 'falling' : r > 1.1 ? 'rising' : 'flat'} ${r.toFixed(2)}x`;
}
const SCORE_COLOURS = { PASS: 'var(--good)', FAIL: 'var(--bad)', 'NO VERDICT': 'var(--waiting)' };
function scoreVerdict(sc) {
  const v = sc.verdict;
  return `<span class="state" style="--c:${SCORE_COLOURS[v.verdict]}" title="${esc(v.why.join('; '))}">${esc(v.verdict)}</span>${v.collapse != null ? ` <span class="sub">collapse from minute ${v.collapse}</span>` : ''}`;
}
/** A row's sparkline over the 10-minute points, scaled to its largest value. */
function scoreSpark(sc, f) {
  const xs = sc.points.map((p) => p[f]);
  const max = Math.max(1e-9, ...xs.filter((x) => x != null).map(Math.abs));
  return utilSvg(xs.map((x) => (x == null ? null : x / max)), 160, 20, 'util-spark');
}
/** The simple view's card: each measure's sparkline, the last hour's value and its trend, and the pass mark. */
function scorecardCard(v) {
  const sc = scorecard?.[v.name];
  if (!sc) return '';
  const lastH = sc.hours[sc.hours.length - 1];
  const rows = SCORE_ROWS.filter(([, f]) => sc.points.some((p) => p[f] != null)).map(([label, f, counter, show]) => {
    const x = lastH ? lastH[f] : sc.points[sc.points.length - 1][f];
    return `<tr><td>${esc(label)}${counter ? ' <span class="sub">/ h</span>' : ''}</td><td>${scoreSpark(sc, f)}</td><td class="mono">${x == null ? '-' : esc(show(x))}</td><td class="sub" style="white-space:nowrap">${esc(scoreTrend(sc.hours, f))}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="label">Scorecard</div>
    <div class="util-head">${scoreVerdict(sc)} <span class="sub">${sc.points.length * 10} min sampled since ${new Date(sc.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}; a collapse is any later hour's busy under half of hour 1's</span></div>
    <table><tbody>${rows}</tbody></table></div>`;
}
/** The detailed view's Scorecard tab: every measure by hour, each need, and the pass mark's lines. */
function scorecardBody(v) {
  const sc = scorecard?.[v.name];
  if (!sc) return '<div class="empty">No scorecard yet: samples start with the panel\'s first request once the village is complete</div>';
  const hs = sc.hours;
  const kinds = [...new Set(sc.points.flatMap((p) => Object.keys(p.needs || {})))];
  const row = (label, vals) => `<tr><td>${esc(label)}</td>${vals.map((x) => `<td class="mono">${x}</td>`).join('')}</tr>`;
  return `<div class="util-head">${scoreVerdict(sc)}</div>${sc.verdict.why.map((w) => `<div class="sub">${esc(w)}</div>`).join('')}
    <table><thead><tr><th></th>${hs.map((h) => `<th>${h.minute / 60}-${h.minute / 60 + 1} h</th>`).join('')}<th>trend</th></tr></thead><tbody>
    ${SCORE_ROWS.map(([label, f, counter, show]) => `<tr><td>${esc(label)}${counter ? ' <span class="sub">added</span>' : ''}</td>${hs.map((h) => `<td class="mono">${h[f] == null ? '-' : esc(show(h[f]))}</td>`).join('')}<td class="sub">${esc(scoreTrend(hs, f))}</td></tr>`).join('')}
    ${kinds.map((k) => row(`  ${k} met`, hs.map((h) => (h.needs?.[k] == null ? '-' : h.needs[k].toFixed(2))))).join('')}
    </tbody></table>
    <div class="sub">busy: an action running (the utilisation clock); needs met: food, housing, light and furnish as shares met; busy, needs met, goods and kinds are hour means, houses, roads and each need the hour's last point, the rest added in the hour. scripts/scorecard.py prints the same for a run's logs.</div>`;
}

async function refresh() {
  if (paused) return;
  try {
    const d = await api(`/api/overview${designsEtag ? `?designs=${encodeURIComponent(designsEtag)}` : ''}`);
    keepDesigns(d);
    recordTrails(d);
    render(d);
    drawUsage(d.usage);
    $('error').innerHTML = '';
  } catch (err) {
    $('error').innerHTML = `<div class="warnbox">Cannot reach the agent server: ${esc(err.message)}</div>`;
    return;
  }
  refreshCalls();
  refreshExtras();
}

// Token use since the agent server started (all agents, not per run) and the hourly cloud budget
function drawUsage(u) {
  lastUsage = u || null;
  const el = $('usage');
  const t = u?.total;
  if (!t || (t.calls || 0) + (t.errors || 0) + (t.refused || 0) === 0) { el.hidden = true; return; }
  const h = u.lastHour || {};
  const b = u.budget || {};
  // (the header keeps the cost and the budget; the rest is in Run, Models and cost, and the tooltip)
  let text = `~$${(t.cost ?? 0).toFixed(2)}`;
  const pct = b.tokensPerHour ? Math.round((100 * (b.usedInWindow || 0)) / b.tokensPerHour) : null;
  if (pct != null) text += ` · ${pct}% of the hour's budget`;
  if (b.blocked && b.retryAt) text += ` · paused until ${new Date(b.retryAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  else if (b.blocked) text += ' · paused';
  el.textContent = text;
  el.style.color = b.blocked ? 'var(--bad)' : pct != null && pct >= 80 ? 'var(--warn)' : '';
  const lines = [`tokens ${fmtTok((t.promptTokens || 0) + (t.outputTokens || 0))} since start, ${fmtTok((h.promptTokens || 0) + (h.outputTokens || 0))} in the last hour`, ...Object.entries(u.byModel || {}).map(([m, x]) =>
    `${m}: ${x?.calls ?? 0} calls, ${fmtTok(x?.promptTokens ?? 0)} in / ${fmtTok(x?.outputTokens ?? 0)} out, ~$${(x?.cost ?? 0).toFixed(3)}`)];
  if (u.unpriced?.length) lines.push(`unpriced: ${u.unpriced.join(', ')}`);
  if (u.since) lines.push(`since ${new Date(u.since).toLocaleString()}`);
  el.title = lines.join('\n');
  el.hidden = false;
}

async function refreshHeader() {
  try {
    const s = await api('/api/status');
    world = { kind: s.world === 'minecraft' ? 'minecraft' : 'sandbox', ...s };
    $('world').innerHTML = world.kind === 'minecraft'
      ? `<span class="dot" style="background:var(--good)"></span> <b>Minecraft ${esc(s.version)}</b> ${esc(s.server)}` +
        (s.worldRules ? ` <span class="sub" style="color:${s.worldRules.ok ? 'inherit' : 'var(--bad)'}" title="${esc(s.worldRules.problems.join('; '))}">${esc(s.worldRules.ok ? 'peaceful, no damage' + (s.worldRules.tickRate && s.worldRules.tickRate !== 20 ? `, ${s.worldRules.tickRate / 20}x speed` : '') : s.worldRules.summary)}</span>` : '')
      : `<span class="dot" style="background:var(--good)"></span> <b>Sandbox</b> seed ${esc(s.seed)}, ${Math.round(s.mspt * 10) / 10} ms/tick`;
    $('mcWatch').hidden = world.kind !== 'minecraft';
    $('worldmap').hidden = world.kind !== 'minecraft';
  } catch {
    $('world').innerHTML = '<span class="dot" style="background:var(--bad)"></span> agent server not answering';
  }
  // (the models loaded go to Run, Models and cost)
  try { modelsInfo = await api('/api/models'); } catch {}
}

refreshFoundry();
setInterval(refreshFoundry, 30000); // G6: the foundry's requests move by the hour
refreshMaps();
setInterval(refreshMaps, 2000);
setTimeout(refreshWorldAtlas, 1500);
setInterval(refreshWorldAtlas, 30000); // the atlas changes slowly: every 30 s (agents and villages come with the 2 s refresh)
setInterval(() => { if (lastData && !paused) render(lastData); }, 1000); // keep the "for N s" timers moving
