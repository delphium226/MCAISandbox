<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Panel</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1c1f24; --muted: #5f6773; --line: #dde1e6;
    --accent: #2f6fdb; --good: #1f8a4c; --bad: #c8372d; --warn: #b7791f; --info: #6b4fd8; --chat: #0f7c86;
    --planning: #6b4fd8; --thinking: #2f6fdb; --acting: #1f8a4c; --waiting: #8a8f98; --idle: #5f6773; --done: #0f7c86; --backoff: #c8372d;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --text: #e6e9ee; --muted: #9aa3ae; --line: #2d333d;
      --accent: #6c9cff; --good: #4cc27f; --bad: #ff6b60; --warn: #e5a93b; --info: #a58cff; --chat: #4fc3cf;
      --planning: #a58cff; --thinking: #6c9cff; --acting: #4cc27f; --waiting: #7d8591; --idle: #9aa3ae; --done: #4fc3cf; --backoff: #ff6b60;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --text: #e6e9ee; --muted: #9aa3ae; --line: #2d333d;
    --accent: #6c9cff; --good: #4cc27f; --bad: #ff6b60; --warn: #e5a93b; --info: #a58cff; --chat: #4fc3cf;
    --planning: #a58cff; --thinking: #6c9cff; --acting: #4cc27f; --waiting: #7d8591; --idle: #9aa3ae; --done: #4fc3cf; --backoff: #ff6b60;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .spacer { flex: 1; }
  button, input { font: inherit; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  input[type=text] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; width: 150px; }
  main { padding: 16px; max-width: 1800px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-head .name { font-weight: 650; font-size: 16px; }
  .sub { color: var(--muted); font-size: 12px; }
  .pill { color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .detail { margin: 6px 0 8px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .bar { width: 70px; height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar i { display: block; height: 100%; }
  .section { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
  ol.steps { margin: 2px 0 0; padding-left: 0; list-style: none; }
  ol.steps li { padding: 1px 0 1px 22px; position: relative; }
  ol.steps li::before { position: absolute; left: 2px; top: 1px; font-size: 12px; }
  ol.steps li.done { color: var(--muted); text-decoration: line-through; }
  ol.steps li.done::before { content: "\2713"; color: var(--good); text-decoration: none; }
  ol.steps li.cur { font-weight: 600; }
  ol.steps li.cur::before { content: "\25B6"; color: var(--accent); }
  ol.steps li.todo::before { content: "\25CB"; color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { padding: 2px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .list li:last-child { border-bottom: 0; }
  .ev-action_done { color: var(--good); } .ev-action_failed { color: var(--bad); } .ev-chat { color: var(--chat); }
  .ev-system { color: var(--info); } .ev-damage, .ev-death { color: var(--warn); } .ev-crafted { color: var(--text); }
  .tag { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; display: inline-block; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; list-style: none; }
  details > summary::before { content: "\25B8 "; } details[open] > summary::before { content: "\25BE "; }
  details { margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .st-open { color: var(--muted); } .st-claimed { color: var(--accent); } .st-done { color: var(--good); } .st-failed { color: var(--bad); }
  .empty { color: var(--muted); font-style: italic; }
  .warnbox { background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid var(--bad); border-radius: 6px; padding: 4px 8px; margin-top: 6px; font-size: 13px; }
  .feed li { display: grid; grid-template-columns: 70px 90px 110px 1fr; gap: 8px; }
  .mapwrap { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  canvas.map { width: 196px; height: 196px; border-radius: 6px; border: 1px solid var(--line); image-rendering: pixelated; background: var(--panel-2); }
  .legend { font-size: 11px; color: var(--muted); display: grid; grid-template-columns: 14px 1fr; gap: 2px 6px; align-items: center; }
  .legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; box-sizing: border-box; }
  #wmAuto.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .wm-acts { position: absolute; top: 30px; right: 10px; max-width: min(340px, 45%); pointer-events: none; display: grid; gap: 2px;
    background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .wm-acts:empty { display: none; }
  .wm-acts div { display: grid; grid-template-columns: 10px max-content minmax(0, 1fr); gap: 6px; align-items: baseline; }
  .wm-acts i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, .6); }
  .wm-acts span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #worldmap .card:fullscreen, #worldmap .card.wm-full { position: fixed; inset: 0; z-index: 20; border-radius: 0; display: flex; flex-direction: column;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); }
  #worldmap .card:fullscreen .wm-box, #worldmap .card.wm-full .wm-box { flex: 1; min-height: 0; }
  #worldmap .card:fullscreen canvas.world, #worldmap .card.wm-full canvas.world { height: 100%; }
  .wm-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 8px; }
  .wm-box { position: relative; }
  canvas.world { display: block; width: 100%; height: 560px; border-radius: 6px; border: 1px solid var(--line); background: #1e1e24; cursor: grab; touch-action: none; }
  canvas.world.dragging { cursor: grabbing; }
  .wm-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; max-width: 340px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  .atlas-keys { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .atlas-keys i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  pre.prompt { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 11.5px; margin: 4px 0; }
  /* Simple mode: the village at a glance */
  body.simple .detailed-only { display: none !important; }
  body:not(.simple) .simple-only { display: none !important; }
  .progress { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; background: var(--good); }
  .village { display: grid; gap: 14px; margin-top: 16px; }
  .vhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 14px 18px; }
  .vhead .progress { grid-column: 1 / -1; margin-top: 4px; }
  .vtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
  .vname { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .vobj { flex-basis: 100%; font-size: 13px; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat { display: grid; justify-items: end; }
  .stat b { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .state { --c: var(--idle); display: inline-block; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .state.big { font-size: 12px; padding: 1px 10px; }
  .vgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .col .card > .label { margin-bottom: 8px; }
  .bchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bchip { font-size: 13px; border-radius: 6px; padding: 2px 9px; background: var(--panel-2); border: 1px solid var(--line); }
  .bchip.done::before { content: "\2713  "; color: var(--good); font-weight: 700; }
  .blist { margin: 0; padding: 0; list-style: none; }
  .blist li { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .blist li:last-child { border-bottom: 0; }
  .blist .bname { font-weight: 600; }
  .bstate.done { color: var(--good); } .bstate.failed { color: var(--bad); } .bstate.claimed { color: var(--accent); } .bstate.open { color: var(--muted); }
  .life { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 16px; margin: 0; }
  .life > div { border-left: 2px solid var(--line); padding-left: 10px; min-width: 0; }
  .life dt { font-size: 12px; color: var(--muted); }
  .life dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .life dd .sub { display: block; font-weight: 400; }
  .stock { display: grid; gap: 8px; }
  .stock-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .mats { display: flex; flex-wrap: wrap; gap: 6px; }
  .mats span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .who { margin: 0; padding: 0; list-style: none; }
  .who li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .who li:last-child { border-bottom: 0; }
  .who-name { display: grid; min-width: 0; overflow-wrap: anywhere; } .who-name b { font-weight: 650; }
  .who-doing { min-width: 0; overflow-wrap: anywhere; }
  .who-state { display: grid; justify-items: end; gap: 2px; }
  .happened li { font-size: 13px; color: var(--muted); }
  .happened li:first-child { color: var(--text); }
  .flag { font-size: 12px; border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; border: 1px solid var(--warn); color: var(--warn); }
  .flag.bad { border-color: var(--bad); color: var(--bad); }
  /* Detailed view: summary cards with drill-down tabs */
  .grid.wide { grid-template-columns: 1fr; }
  .dcard { display: grid; gap: 8px; align-content: start; }
  #agents { align-items: start; }
  .dcard .card-head .state { margin-left: 4px; }
  .now { display: grid; gap: 2px; }
  .now .mono { overflow-wrap: anywhere; }
  .vitals { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .tabs.sm { border-top: 0; padding-top: 0; margin-bottom: 6px; }
  .tab { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: transparent; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
  .tab .cnt { font-variant-numeric: tabular-nums; opacity: .7; }
  .tab:focus-visible, .acts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabbody { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; max-height: 460px; overflow: auto; }
  .tabbody .label { margin-top: 8px; } .tabbody .label:first-child { margin-top: 0; }
  .tabbody pre.prompt { max-height: 300px; background: var(--panel); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stats.left { justify-content: flex-start; gap: 18px; }
  .stats.left .stat { justify-items: start; }
  .stats.left .stat b { font-size: 18px; }
  .stat.bad b { color: var(--bad); }
  .now-list li { font-size: 13px; display: flex; gap: 8px; min-width: 0; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  @media (max-width: 700px) {
    .vgrid { grid-template-columns: 1fr; }
    .vhead { grid-template-columns: 1fr; }
    .stat { justify-items: start; }
    .stock-row { grid-template-columns: 1fr; gap: 2px; }
    .grid { grid-template-columns: 1fr; }
    main { padding: 12px 16px; }
    .feed li { grid-template-columns: 1fr; gap: 0; }
    input[type=text] { width: 120px; }
    canvas.world { height: min(560px, 70vh); }
  }
</style>
</head>
<body>
<header>
  <h1>Agent control panel</h1>
  <span class="chip" id="world"><span class="dot"></span> connecting…</span>
  <span id="models" class="detailed-only"></span>
  <span class="spacer"></span>
  <span class="chip detailed-only" id="mcWatch" hidden>watch as <input type="text" id="player" placeholder="your player name" aria-label="Your Minecraft player name"></span>
  <button id="mode" title="Switch between the simple and the detailed view">Detailed view</button>
  <button id="pause" title="Stop or resume refreshing">Pause</button>
  <button id="theme" title="Switch light and dark">Theme</button>
  <span class="chip" id="updated">–</span>
</header>
<main>
  <div id="error"></div>
  <div class="simple-only" id="simple"></div>
  <div id="wmSlotSimple">
    <section id="worldmap" hidden>
      <h2>World map <span class="sub" id="wmInfo" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="card">
        <div class="wm-bar">
          <button id="wmAuto" class="tab-like" title="Keep every agent and its village in view, zooming out and in as they move; panning or zooming by hand turns it off">Auto on</button>
          <button id="wmFit" title="Show every chunk the bots have seen">Fit</button>
          <button id="wmHome" title="Centre on the running agents' village">Agents</button>
          <button id="wmIn" title="Zoom in">+</button>
          <button id="wmOut" title="Zoom out">&minus;</button>
          <button id="wmFull" title="Show the map on the whole screen (Esc returns)">Fullscreen</button>
          <button id="wmTrail" title="How far back the agents' trails go (the page keeps them while it is open)">Trail</button>
          <span class="sub">drag to pan, wheel to zoom (either turns Auto off); north is up</span>
        </div>
        <div class="wm-box">
          <canvas class="world" id="wmCanvas" aria-label="Map of every chunk the bots have seen, with the villages and agents"></canvas>
          <div class="wm-acts" id="wmActs" aria-live="off"></div>
          <div class="wm-tip" id="wmTip" hidden></div>
        </div>
        <div class="atlas-keys" id="wmKeys"></div>
      </div>
    </section>
  </div>
  <div class="detailed-only">
    <h2>Agents <span id="agentCount" class="sub"></span></h2>
    <div class="grid" id="agents"></div>
    <div id="villagesWrap"></div>
    <div id="wmSlotDetailed"></div>
    <div id="feedWrap"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const STATE_COLORS = { planning: 'var(--planning)', thinking: 'var(--thinking)', acting: 'var(--acting)', waiting: 'var(--waiting)', idle: 'var(--idle)', done: 'var(--done)', 'backing off': 'var(--backoff)' };
let paused = false, world = null, lastData = null;
const openDetails = new Set(JSON.parse(store.get('panel.open', '[]')));

const theme = store.get('panel.theme', '');
if (theme) document.documentElement.dataset.theme = theme;
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('panel.theme', next);
};
// Simple (the village at a glance, the default) or detailed (everything, for debugging); remembered per browser
let simple = location.hash === '#detailed' ? false : location.hash === '#simple' ? true : store.get('panel.mode', 'simple') === 'simple';
const applyMode = () => {
  document.body.classList.toggle('simple', simple);
  $('mode').textContent = simple ? 'Detailed view' : 'Simple view';
  $(simple ? 'wmSlotSimple' : 'wmSlotDetailed').appendChild($('worldmap')); // the world map follows the village cards
};
applyMode();
$('mode').onclick = () => {
  simple = !simple;
  store.set('panel.mode', simple ? 'simple' : 'detailed');
  history.replaceState(null, '', simple ? '#simple' : '#detailed');
  applyMode();
  if (lastData) render(lastData);
  if (!simple) refreshMaps();
};
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
$('player').value = store.get('panel.player', '');
$('player').onchange = () => store.set('panel.player', $('player').value.trim());

function ago(ms) {
  if (!ms) return '';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
}
const bar = (v, max, color) => `<span class="bar" title="${v}/${max}"><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%;background:${color}"></i></span>`;
const fmtArgs = (args) => Object.entries(args || {}).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
const det = (key, title, body, openByDefault = false) => {
  const open = openDetails.has(key) || (openByDefault && !openDetails.has('!' + key));
  return `<details data-key="${esc(key)}" ${open ? 'open' : ''}><summary>${title}</summary>${body}</details>`;
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path}: ${res.status} ${(await res.text()).slice(0, 200)}`);
  return res.json();
}

function renderPlan(p) {
  if (!p) return '<div class="empty">no plan yet</div>';
  const steps = p.steps || [];
  const list = steps.length
    ? `<ol class="steps">${steps.map((s, i) => `<li class="${i < p.step ? 'done' : i === p.step ? 'cur' : 'todo'}">${esc(s)}</li>`).join('')}</ol>`

// ---- trails: where each agent has been (the page keeps them; the server keeps no history) ----
const TRAIL_KEEP = 15 * 60000, TRAIL_LENGTHS = [60000, 5 * 60000, 15 * 60000, 0];
let trailMs = Number(store.get('panel.trail', String(5 * 60000)));
if (!TRAIL_LENGTHS.includes(trailMs)) trailMs = 5 * 60000;
const trails = (() => { try { return new Map(Object.entries(JSON.parse(sessionStorage.getItem('panel.trails') || '{}')).filter(([, t]) => Array.isArray(t))); } catch { return new Map(); } })();
let trailsSaved = 0;
const saveTrails = () => { try { sessionStorage.setItem('panel.trails', JSON.stringify(Object.fromEntries(trails))); } catch {} };
globalThis.addEventListener?.('pagehide', saveTrails);
function recordTrails(d) {
  const now = Date.now();
  for (const a of d.agents || []) {
    if (!a.position) continue;
    const t = trails.get(a.name) || [];
    const last = t[t.length - 1];
    // (a new point once it moved half a block, or every 10 s while still)
    if (!last || Math.hypot(a.position.x - last[1], a.position.z - last[2]) > 0.5 || now - last[0] > 10000) t.push([now, Math.round(a.position.x * 10) / 10, Math.round(a.position.z * 10) / 10]);
    while (t.length && now - t[0][0] > TRAIL_KEEP) t.shift();
    trails.set(a.name, t);
  }
  for (const [name, t] of trails) if (!t.length || now - t[t.length - 1][0] > TRAIL_KEEP) trails.delete(name);
  if (now - trailsSaved > 10000) { trailsSaved = now; saveTrails(); }
}
/** Each agent's colour on the maps (from its name, so it keeps it across reloads). */
function agentColor(name) {
  let h = 0;
  for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `hsl(${(h * 137) % 360} 85% 62%)`;
}
/** A fading line through an agent's recent positions; a jump over 24 blocks (a teleport) breaks it. */
function drawTrail(g, name, X, Z, width) {
  const t = trails.get(name);
  if (!t || t.length < 2 || !trailMs) return;
  const now = Date.now();
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  // (a dark edge under the colour: a green or blue trail on grass or water)
  for (const [w, colour] of [[width + 2, 'rgba(0,0,0,.55)'], [width, agentColor(name)]]) {
    g.lineWidth = w; g.strokeStyle = colour;
    for (let i = 1; i < t.length; i++) {
      const [t0, x0, z0] = t[i - 1], [, x1, z1] = t[i];
      const age = now - t0;
      if (age > trailMs || Math.hypot(x1 - x0, z1 - z0) > 24) continue;
      g.globalAlpha = Math.max(0.06, 0.9 * (1 - age / trailMs));
      g.beginPath(); g.moveTo(X(x0), Z(z0)); g.lineTo(X(x1), Z(z1)); g.stroke();
    }
  }
  g.restore();
}
const trailLabel = () => { $('wmTrail').textContent = trailMs ? `Trail ${trailMs / 60000} min` : 'Trail off'; };
trailLabel();
$('wmTrail').onclick = () => {
  trailMs = TRAIL_LENGTHS[(TRAIL_LENGTHS.indexOf(trailMs) + 1) % TRAIL_LENGTHS.length];
  store.set('panel.trail', String(trailMs));
  trailLabel();
  drawWorld(); drawMaps();
};

// ---- the world map (the shared atlas: 4x4-block cells of every chunk a bot has seen, with every village) ----
const CELL_RGB = {
  s: [217, 201, 140], r: [192, 122, 58], d: [224, 210, 150], D: [186, 99, 40], x: [138, 138, 138], g: [130, 125, 120],
  c: [160, 166, 179], t: [156, 91, 59], o: [90, 161, 66], n: [238, 243, 246], b: [150, 110, 160], '~': [58, 111, 216],
  '^': [224, 98, 42], T: [38, 100, 44],
};
const CELL_NAMES = {
  s: 'sand', r: 'red sand', d: 'sandstone', D: 'red sandstone', x: 'stone', g: 'gravel', c: 'clay', t: 'terracotta',
  o: 'grass, dirt', n: 'snow, ice', '~': 'water', '^': 'lava', T: 'trees', b: 'built, other',
};
const ATLAS_KEYS = [['T', 'trees'], ['o', 'grass, dirt'], ['s', 'sand'], ['x', 'stone'], ['t', 'terracotta'], ['~', 'water'], ['b', 'built, other']];
const WM_ZOOM = { min: 0.05, max: 16, home: 3 }; // screen px per block
// The atlas as one image (a pixel per cell, north-west corner at x0, z0), the villages from the last atlas fetch, the view
const wm = { chunks: new Map(), villages: [], status: null, fallback: false, img: null, x0: 0, z0: 0, view: null, drag: null };
const chunkKey = (cx, cz) => `${cx},${cz}`;
/** Where a village is: its layout or first plot, else its first chest (villageHome on the server). */
function homeOf(v) {
  const p = (v.layouts && v.layouts[0]) || (v.plots && v.plots[0]);
  if (p) return { x: Math.floor((p.x1 + p.x2) / 2), z: Math.floor((p.z1 + p.z2) / 2) };
  const c = v.storage && v.storage.chests && v.storage.chests[0];
  return c ? { x: c.x, z: c.z } : null;
}
function setAtlas(chunks) {
  wm.chunks = new Map(chunks.map((s) => [chunkKey(s.cx, s.cz), s]));
  wm.img = null;
  if (!chunks.length) return;
  let cx0 = Infinity, cz0 = Infinity, cx1 = -Infinity, cz1 = -Infinity;
  for (const s of chunks) { cx0 = Math.min(cx0, s.cx); cz0 = Math.min(cz0, s.cz); cx1 = Math.max(cx1, s.cx); cz1 = Math.max(cz1, s.cz); }
  // Shaded by height against the median ground (lighter is higher)
  const meds = chunks.filter((s) => s.y).map((s) => s.y[1]).sort((p, q) => p - q);
  const ref = meds.length ? meds[meds.length >> 1] : 64;
  const n = (cx1 - cx0 + 1) * 4, m = (cz1 - cz0 + 1) * 4;
  const cv = document.createElement('canvas'); cv.width = n; cv.height = m;
  const g = cv.getContext('2d'), img = g.createImageData(n, m);
  for (const s of chunks)
    for (let c = 0; c < 16; c++) {
      if (!s.s[c] || s.s[c] === ' ') continue;
      let rgb = CELL_RGB[s.s[c]] || [110, 110, 120];
      if (s.h[c] !== null) { const f = Math.max(-0.4, Math.min(0.4, (s.h[c] - ref) / 25)); rgb = rgb.map((u) => Math.max(0, Math.min(255, u * (1 + f)))); }
      img.data.set([rgb[0], rgb[1], rgb[2], 255], (((s.cz - cz0) * 4 + (c >> 2)) * n + (s.cx - cx0) * 4 + (c & 3)) * 4);
    }
  g.putImageData(img, 0, 0);
  Object.assign(wm, { img: cv, x0: cx0 * 16, z0: cz0 * 16 });
}

async function refreshMaps() {

// ---- the simple view ----
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/** A building's name as people say it: "plains_small_house_1" -> "Small house 1". */
const buildingName = (id) => cap(words(String(id).replace(/^(plains|savanna|desert|taiga|snowy)_/, '')));
/** What an action is, in plain words ("Gathering 12 acacia logs"). */

    case 'craft': return `Crafting ${n}${item}`;
    case 'smelt': return `Smelting ${n}${item}`;
    case 'place': return `Placing ${item}`;
    case 'chat': return 'Talking';
    case 'wait': return 'Waiting';
    case 'eat': return 'Eating';
    case 'follow': return `Following ${words(args.player)}`;
    case 'dig_mine': return 'Digging the village mine';
    case 'dig_iron': return 'Mining deep for iron';
    case 'make_iron_tool': return `Making an iron ${words(args.item ?? 'tool').replace(/^iron /, '')}`;
    case 'tend_farm': return 'Planting the wheat field';
    case 'harvest_farm': return 'Harvesting the wheat field';
    case 'start_farm': return `Starting a ${words(args.kind ?? 'new')} farm`;
    case 'harvest_slot': return 'Harvesting a farm';
    case 'prepare_annex': return 'Clearing land for the animal pens';
    case 'start_pen': return `Leading ${words(args.kind ?? 'animal')}s into a pen`;
    case 'collect_eggs': return 'Collecting eggs';
    case 'milk_cows': return 'Milking the cows';
    case 'breed_pen': return 'Breeding the animals';
    case 'bake_cake': return 'Baking a cake';
    case 'light_streets': return 'Putting up street lamps';

/** The agent's state for the pill: the brain's own, or (scripted workers) acting or waiting. */
const agentState = (a) => (a.dead ? 'dead' : a.status?.state || (a.currentAction ? 'acting' : 'waiting'));
function doingWords(a) {
  const st = a.status || {};

  if (a.currentAction) return actionWords(a.currentAction.type, a.currentAction.args);
  if (st.state === 'planning') return 'Thinking about what to do next';
  if (st.state === 'thinking') return 'Deciding the next step';
  if (a.brain === 'idle' || !a.brain) return 'Idle (controlled by hand)';
  if (a.villageRole === 'mayor') return a.plan && a.plan.steps && a.plan.steps.length ? 'Planning the village' : 'Overseeing the village';

/** Trouble worth a glance: rescued lately, or failing again and again. */

  const ev = (a.events || []).slice(-10);

  if ((st.failuresSincePlan || 0) >= 3) out.push(`<span class="flag bad">${st.failuresSincePlan} failures lately</span>`);
  if (a.health < 20 && !a.dead) out.push(`<span class="flag">health ${a.health}</span>`);
  return out.join('');
}
function simpleAgents(agents) {
  if (!agents.length) return '<div class="empty">No agents are running.</div>';
  const order = (a) => (a.villageRole === 'mayor' ? 0 : 1);
  return `<ul class="who">${agents.slice().sort((x, y) => order(x) - order(y) || x.name.localeCompare(y.name)).map((a) => {
    const st = a.status || {};

    const color = STATE_COLORS[state] || 'var(--idle)';
    const sub = a.task && a.currentAction ? a.task.title : '';
    return `<li>
      <div class="who-name"><b>${esc(a.name)}</b><span class="sub">${esc(a.villageRole || a.role)}</span></div>
      <div class="who-doing">${esc(doingWords(a))}${flags(a)}${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      <div class="who-state"><span class="state" style="--c:${color}">${esc(state)}</span>${st.since ? `<span class="sub">${ago(st.since)}</span>` : ''}</div></li>`;
  }).join('')}</ul>`;

/** Each building the village laid out, and where it stands: [name, state class, words]. */
function buildingStates(v) {
  const byId = new Map(v.tasks.map((t) => [t.id, t]));
  return v.tasks.filter((t) => /^Build /.test(t.title)).map((t) => {
    const name = buildingName(t.title.slice(6));
    if (t.status === 'done') return [name, 'done', 'built'];
    if (t.status === 'failed') return [name, 'failed', 'failed: the mayor will look at it'];
    if (t.status === 'claimed') return [name, 'claimed', `being built by ${t.claimedBy}`];
    const pre = (t.after || []).map((id) => byId.get(id)).filter((x) => x && /^Gather /.test(x.title));
    const done = pre.filter((x) => x.status === 'done' || x.status === 'failed').length;
    const land = (t.after || []).map((id) => byId.get(id)).find((x) => x && /^Prepare /.test(x.title) && x.status !== 'done');

/** Storage by use: building materials, food and farm, tools and metal (anything else is left out of the summary). */
const STOCK = [
  ['Building', [['logs', (n) => /_log$/.test(n)], ['planks', (n) => /_planks$/.test(n)], ['cobblestone', (n) => n === 'cobblestone'], ['sand', (n) => n === 'sand'], ['glass', (n) => /^glass(_pane)?$/.test(n)]]],
  ['Food and farm', [['wheat', (n) => n === 'wheat'], ['seeds', (n) => /_seeds$/.test(n)], ['bread', (n) => n === 'bread'], ['eggs', (n) => /egg$/.test(n)], ['milk', (n) => n === 'milk_bucket'], ['cake', (n) => n === 'cake'], ['sugar cane', (n) => n === 'sugar_cane'], ['pumpkins', (n) => n === 'pumpkin'], ['melon', (n) => /^melon(_slice)?$/.test(n)]]],
  ['Tools and metal', [['raw iron', (n) => n === 'raw_iron'], ['iron ingots', (n) => n === 'iron_ingot'], ['coal', (n) => /^(coal|charcoal)$/.test(n)], ['buckets', (n) => n === 'bucket'], ['iron tools', (n) => /^iron_(pickaxe|axe|shovel|hoe|sword)$/.test(n)]]],

/** What the village does after its buildings: the field, farms, pens, the iron age, lamps and signs. */
function villageLife(v) {
  const items = [];
  (v.layouts || []).forEach((lay, k) => {
  const site = k ? ` (site ${k + 1})` : '';
  const f = lay.farm;
  if (f) items.push([`Wheat field${site}`, f.planted ? `${f.planted} planted` : 'not planted yet',
    f.harvests ? `${plural(f.harvests, 'harvest')}${f.bread ? `, ${f.bread} bread baked` : ''}` : '']);

      items.push([`${cap(animal)} pen`, s.laying ? 'animals being led in' : p.built ? plural(p.animals || 0, animal) : 'being fenced', extra]);

      <div class="vtitle"><span class="vname">${esc(v.name)}</span><span class="state big" style="--c:${state[1]}">${state[0]}</span>

function renderSimple(d) {

function render(d) {
  lastData = d;
  if (String(window.getSelection?.() ?? '')) return;
  const scrolls = [...document.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop]);
  const f = document.activeElement?.dataset || {};
  const focus = f.tab ? `button[data-tabkey="${CSS.escape(f.tabkey)}"][data-tab="${CSS.escape(f.tab)}"]`
    : f.act ? `button[data-act="${CSS.escape(f.act)}"][data-agent="${CSS.escape(f.agent || '')}"]` : null;
  renderNow(d);
  for (const [k, top] of scrolls) { const el = document.querySelector(`[data-scroll="${CSS.escape(k)}"]`); if (el) el.scrollTop = top; }
  if (focus) document.querySelector(focus)?.focus();
}

document.addEventListener('toggle', (e) => {
  const el = e.target;
  if (!(el instanceof HTMLDetailsElement) || !el.dataset.key) return;
  const key = el.dataset.key;
  if (el.open) { openDetails.add(key); openDetails.delete('!' + key); } else { openDetails.delete(key); openDetails.add('!' + key); }
  store.set('panel.open', JSON.stringify([...openDetails]));
}, true);

document.addEventListener('click', async (e) => {
  const tb = e.target.closest('button[data-tab]');
  if (tb) {
    // (a second click closes a card's tab; a filter, data-keep, stays chosen)
    const k = tb.dataset.tabkey, id = tb.dataset.tab;
    if (openTabs[k] === id && !tb.dataset.keep) delete openTabs[k]; else openTabs[k] = id;
    store.set('panel.tabs', JSON.stringify(openTabs));
    if (lastData) render(lastData);
    if (openTabs[k] === 'map') refreshMaps();
    return;
  }
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const name = b.dataset.agent;
  try {
    if (b.dataset.act === 'stop') await api(`/api/agents/${encodeURIComponent(name)}/stop`, { method: 'POST' });
    if (b.dataset.act === 'remove') {
      if (!confirm(`Remove ${name} from the world?`)) return;
      await api(`/api/agents/${encodeURIComponent(name)}`, { method: 'DELETE' });
    }
    if (b.dataset.act === 'watch') {
      const player = $('player').value.trim();
      if (!player) { $('player').focus(); alert('Type your Minecraft player name in "watch as" first.'); return; }
      await api('/api/watch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ player, agent: name }) });
    }
    refresh();
  } catch (err) { alert(err.message); }
});

async function refresh() {
  if (paused) return;
  try {
    const d = await api('/api/overview');
    recordTrails(d);
    render(d);
    $('error').innerHTML = '';
  } catch (err) {
    $('error').innerHTML = `<div class="warnbox">Cannot reach the agent server: ${esc(err.message)}</div>`;
  }
}

async function refreshHeader() {
  try {
    const s = await api('/api/status');
    world = { kind: s.world === 'minecraft' ? 'minecraft' : 'sandbox', ...s };
    $('world').innerHTML = world.kind === 'minecraft'
      ? `<span class="dot" style="background:var(--good)"></span> <b>Minecraft ${esc(s.version)}</b> ${esc(s.server)}` +
        (s.worldRules ? ` <span class="sub" style="color:${s.worldRules.ok ? 'inherit' : 'var(--bad)'}" title="${esc(s.worldRules.problems.join('; '))}">${esc(s.worldRules.ok ? 'peaceful, no damage' + (s.worldRules.tickRate && s.worldRules.tickRate !== 20 ? `, ${s.worldRules.tickRate / 20}x speed` : '') : s.worldRules.summary)}</span>` : '')
      : `<span class="dot" style="background:var(--good)"></span> <b>Sandbox</b> seed ${esc(s.seed)}, ${Math.round(s.mspt * 10) / 10} ms/tick`;
    $('mcWatch').hidden = world.kind !== 'minecraft';
    $('worldmap').hidden = world.kind !== 'minecraft';
  } catch {
    $('world').innerHTML = '<span class="dot" style="background:var(--bad)"></span> agent server not answering';
  }
  try {
    const m = await api('/api/models');
    $('models').innerHTML = m.ok
      ? (m.models.length ? m.models.map((x) => `<span class="chip" title="${x.vramMB < x.sizeMB ? 'partly on the CPU: slow' : 'all in VRAM'}"><span class="dot" style="background:${x.vramMB < x.sizeMB ? 'var(--warn)' : 'var(--good)'}"></span><b>${esc(x.name)}</b> ${(x.vramMB / 1024).toFixed(1)} GB${x.server && x.server !== '11434' ? ` <span class="sub">:${esc(x.server)}</span>` : ''}</span>`).join(' ') + (m.error ? ` <span class="chip" style="color:var(--bad)">${esc(m.error)}</span>` : '') : '<span class="chip">Ollama: no models loaded</span>')
      : `<span class="chip" style="color:var(--bad)">${esc(m.error)}</span>`;
  } catch {}
}

refreshHeader();
refresh();
setInterval(refresh, 2000);
setInterval(refreshHeader, 5000);
refreshMaps();
setInterval(refreshMaps, 2000);
setTimeout(refreshWorldAtlas, 1500);
setInterval(refreshWorldAtlas, 30000); // the atlas changes slowly: every 30 s (agents and villages come with the 2 s refresh)
setInterval(() => { if (lastData && !paused) render(lastData); }, 1000); // keep the "for N s" timers moving
