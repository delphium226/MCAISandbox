<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Panel</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1c1f24; --muted: #5f6773; --line: #dde1e6;
    --accent: #2f6fdb; --good: #1f8a4c; --bad: #c8372d; --warn: #b7791f; --info: #6b4fd8; --chat: #0f7c86;
    --planning: #6b4fd8; --thinking: #2f6fdb; --acting: #1f8a4c; --waiting: #8a8f98; --idle: #5f6773; --done: #0f7c86; --backoff: #c8372d;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --text: #e6e9ee; --muted: #9aa3ae; --line: #2d333d;
      --accent: #6c9cff; --good: #4cc27f; --bad: #ff6b60; --warn: #e5a93b; --info: #a58cff; --chat: #4fc3cf;
      --planning: #a58cff; --thinking: #6c9cff; --acting: #4cc27f; --waiting: #7d8591; --idle: #9aa3ae; --done: #4fc3cf; --backoff: #ff6b60;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --panel: #1a1e24; --panel-2: #222731; --text: #e6e9ee; --muted: #9aa3ae; --line: #2d333d;
    --accent: #6c9cff; --good: #4cc27f; --bad: #ff6b60; --warn: #e5a93b; --info: #a58cff; --chat: #4fc3cf;
    --planning: #a58cff; --thinking: #6c9cff; --acting: #4cc27f; --waiting: #7d8591; --idle: #9aa3ae; --done: #4fc3cf; --backoff: #ff6b60;
  }
  * { box-sizing: border-box; }
  /* (author display rules such as .chip's beat the browser's own [hidden] rule) */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  /* (the world and usage chips wrap: on a 375 px screen they ran 11 and 36 px past the edge) */
  #world, #usage { white-space: normal; flex-wrap: wrap; max-width: 100%; border-radius: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .spacer { flex: 1; }
  button, input { font: inherit; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--bad); background: transparent; border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  input[type=text] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; width: 150px; }
  main { padding: 16px; max-width: 1800px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-head .name { font-weight: 650; font-size: 16px; }
  .sub { color: var(--muted); font-size: 12px; }
  .pill { color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .detail { margin: 6px 0 8px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .bar { width: 70px; height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar i { display: block; height: 100%; }
  /* The village appetite (s30): a thin bar under an agent's name, its level of 20 in its state's colour */
  .appbar { display: block; width: 100%; max-width: 120px; height: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .appbar i { display: block; height: 100%; }
  .appbar.inline { display: inline-block; width: 36px; vertical-align: middle; margin: 0 0 0 4px; flex: none; }
  .section { border-top: 1px solid var(--line); margin-top: 9px; padding-top: 8px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
  ol.steps { margin: 2px 0 0; padding-left: 0; list-style: none; }
  ol.steps li { padding: 1px 0 1px 22px; position: relative; }
  ol.steps li::before { position: absolute; left: 2px; top: 1px; font-size: 12px; }
  ol.steps li.done { color: var(--muted); text-decoration: line-through; }
  ol.steps li.done::before { content: "\2713"; color: var(--good); text-decoration: none; }
  ol.steps li.cur { font-weight: 600; }
  ol.steps li.cur::before { content: "\25B6"; color: var(--accent); }
  ol.steps li.todo::before { content: "\25CB"; color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { padding: 2px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .list li:last-child { border-bottom: 0; }
  /* A2: the option an agent chose in its Choice tab, and the village's decisions chip (it may wrap) */
  .list li.chosen { background: color-mix(in srgb, var(--good) 14%, transparent); border-radius: 4px; }
  .chip.choices { white-space: normal; }
  .ev-action_done { color: var(--good); } .ev-action_failed { color: var(--bad); } .ev-chat { color: var(--chat); }
  .ev-system { color: var(--info); } .ev-damage, .ev-death { color: var(--warn); } .ev-crafted { color: var(--text); }
  .tag { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; display: inline-block; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 1px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; list-style: none; }
  details > summary::before { content: "\25B8 "; } details[open] > summary::before { content: "\25BE "; }
  details { margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .st-open { color: var(--muted); } .st-claimed { color: var(--accent); } .st-done { color: var(--good); } .st-failed { color: var(--bad); }
  .empty { color: var(--muted); font-style: italic; }
  .warnbox { background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid var(--bad); border-radius: 6px; padding: 4px 8px; margin-top: 6px; font-size: 13px; }
  .feed li { display: grid; grid-template-columns: 70px 90px 110px 1fr; gap: 8px; }
  .mapwrap { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  canvas.map { width: 196px; height: 196px; border-radius: 6px; border: 1px solid var(--line); image-rendering: pixelated; background: var(--panel-2); }
  .legend { font-size: 11px; color: var(--muted); display: grid; grid-template-columns: 14px 1fr; gap: 2px 6px; align-items: center; }
  .legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; box-sizing: border-box; }
  #wmAuto.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .wm-key { position: absolute; right: 10px; bottom: 10px; max-width: min(300px, 55%); max-height: calc(100% - 20px); overflow: auto;
    background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11.5px; }
  .wm-key > button { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; color: var(--muted); }
  .wm-key.closed #wmKeyBody { display: none; }
  .key-icons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 10px; margin-top: 6px; }
  .key-icons span, .key-ground span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key-icons canvas { width: 18px; height: 18px; flex: none; }
  .key-trail { width: 18px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, hsl(200 85% 62%)); flex: none; }
  .key-ground { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 10px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); }
  .key-ground i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
  .wm-acts { position: absolute; top: 30px; right: 10px; max-width: min(340px, 45%); pointer-events: none; display: grid; gap: 2px;
    background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .wm-acts:empty { display: none; }
  .wm-acts div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wm-acts i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, .6); margin-right: 6px; }
  .wm-acts span { color: var(--muted); margin-left: 6px; }
  /* (over 8 agents: a line per activity, names wrapping under it) */
  .wm-acts.many { max-width: min(380px, 50%); }
  .wm-acts.many div { white-space: normal; overflow: visible; }
  .wm-acts.many span { margin-left: 4px; color: var(--text); white-space: nowrap; }
  .wm-acts.many span i { width: 7px; height: 7px; margin-right: 2px; }
  #worldmap .card:fullscreen, #worldmap .card.wm-full { position: fixed; inset: 0; z-index: 20; border-radius: 0; display: flex; flex-direction: column;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); }
  #worldmap .card:fullscreen .wm-box, #worldmap .card.wm-full .wm-box { flex: 1; min-height: 0; }
  #worldmap .card:fullscreen canvas.world, #worldmap .card.wm-full canvas.world { height: 100%; }
  .wm-bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 8px; }
  .wm-box { position: relative; }
  canvas.world { display: block; width: 100%; height: 560px; border-radius: 6px; border: 1px solid var(--line); background: #1e1e24; cursor: grab; touch-action: none; }
  canvas.world.dragging { cursor: grabbing; }
  .wm-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; max-width: 340px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  pre.prompt { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 11.5px; margin: 4px 0; }
  /* #67: utilisation graphs */
  .util-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0 6px; }
  .util-head .chip.on { border-color: var(--accent); color: var(--accent); }
  .util-chart { display: block; width: 100%; height: 80px; background: var(--panel-2); border-radius: 4px; }
  .util-spark { display: block; width: 240px; max-width: 100%; height: 24px; background: var(--panel-2); border-radius: 3px; }
  .util-area { fill: color-mix(in srgb, var(--accent) 35%, transparent); stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .util-grid { stroke: var(--line); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .util-axis { display: flex; justify-content: space-between; }
  .util-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .progress { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; background: var(--good); }
  .village { display: grid; gap: 14px; margin-top: 16px; }
  .vhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 14px 18px; }
  .vhead .progress { grid-column: 1 / -1; margin-top: 4px; }
  .vtitle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
  .vname { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .vobj { flex-basis: 100%; font-size: 13px; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat { display: grid; justify-items: end; }
  .stat b { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .dcard[data-village] { scroll-margin-top: 70px; }
  .stat a.failed { font-size: 12px; font-weight: 600; color: var(--bad); }
  .state { --c: var(--idle); display: inline-block; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .state.big { font-size: 12px; padding: 1px 10px; }
  .vgrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; min-width: 0; }
  .col .card > .label { margin-bottom: 8px; }
  .bchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bchip { font-size: 13px; border-radius: 6px; padding: 2px 9px; background: var(--panel-2); border: 1px solid var(--line); }
  .bchip.done::before { content: "\2713  "; color: var(--good); font-weight: 700; }
  .blist { margin: 0; padding: 0; list-style: none; }
  .blist li { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .blist li:last-child { border-bottom: 0; }
  .blist .bname { font-weight: 600; }
  .bstate.done { color: var(--good); } .bstate.failed { color: var(--bad); } .bstate.claimed { color: var(--accent); } .bstate.open { color: var(--muted); }
  .life { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 16px; margin: 0; }
  .life > div { border-left: 2px solid var(--line); padding-left: 10px; min-width: 0; }
  .life dt { font-size: 12px; color: var(--muted); }
  .life dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .life dd .sub { display: block; font-weight: 400; }
  /* Village life's streets (a row per site, like ones merged) and the last vote (ranked, a bar each) */
  .lifex { display: flex; flex-wrap: wrap; gap: 14px 24px; }
  .lifex > div { flex: 1 1 220px; min-width: 0; }
  table.streets td { font-variant-numeric: tabular-nums; }
  /* G8's Ladder view */
  table.grid { border-collapse: collapse; font-size: 13px; width: 100%; }
  table.grid th, table.grid td { text-align: left; padding: 3px 10px 3px 0; vertical-align: top; }
  table.grid th { color: var(--muted); font-weight: 500; }
  .vrow { font-size: 13px; margin-bottom: 6px; }
  .vrow .vtop { display: flex; justify-content: space-between; gap: 8px; }
  .vrow .vtop > span:last-child { font-variant-numeric: tabular-nums; }
  .vbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .vbar i { display: block; height: 100%; }
  .stock { display: grid; gap: 8px; }
  .stock-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .mats { display: flex; flex-wrap: wrap; gap: 6px; }
  .mats span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .who { margin: 0; padding: 0; list-style: none; }
  .who li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .who li:last-child { border-bottom: 0; }
  .who-name { display: grid; min-width: 0; overflow-wrap: anywhere; } .who-name b { font-weight: 650; }
  .who-doing { min-width: 0; overflow-wrap: anywhere; }
  .who-state { display: grid; justify-items: end; gap: 2px; }
  .happened li { font-size: 13px; color: var(--muted); }
  .happened li:first-child { color: var(--text); }
  .flag { font-size: 12px; border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; border: 1px solid var(--warn); color: var(--warn); }
  .flag.bad { border-color: var(--bad); color: var(--bad); }
  /* Detailed view: summary cards with drill-down tabs */
  .grid.wide { grid-template-columns: 1fr; }
  .dcard { display: grid; gap: 8px; align-content: start; }
  #agents { align-items: start; }
  .dcard .card-head .state { margin-left: 4px; }
  .now { display: grid; gap: 2px; }
  .now .mono { overflow-wrap: anywhere; }
  .vitals { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .tabs.sm { border-top: 0; padding-top: 0; margin-bottom: 6px; }
  .tab { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: transparent; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab.on { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
  .tab .cnt { font-variant-numeric: tabular-nums; opacity: .7; }
  .tab:focus-visible, .acts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabbody { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; max-height: 460px; overflow: auto; }
  .tabbody .label { margin-top: 8px; } .tabbody .label:first-child { margin-top: 0; }
  .tabbody pre.prompt { max-height: 300px; background: var(--panel); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stats.left { justify-content: flex-start; gap: 18px; }
  .stats.left .stat { justify-items: start; }
  .stats.left .stat b { font-size: 18px; }
  .stat.bad b { color: var(--bad); }
  .now-list li { font-size: 13px; display: flex; gap: 8px; min-width: 0; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* Activity groups and their filter chips (both views), and the detailed view's folded agents */
  .afilter { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  h2 .afilter { display: inline-flex; margin: 0 0 0 10px; vertical-align: middle; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .who-group { display: flex; align-items: baseline; gap: 6px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 0 2px; border-bottom: 1px solid var(--line); }
  .afilter + .who-group { padding-top: 0; }
  .who-group .cnt { font-variant-numeric: tabular-nums; font-weight: 400; }
  .who-group .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
  /* (idle agents fold into one row of name chips; the full name and what it waits for in the tooltip) */
  .ichips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px; }
  .ichip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px 1px 6px; white-space: nowrap; }
  .ichip.flagged { border-color: var(--bad); }
  .who.compact li { grid-template-columns: 150px minmax(0, 1fr) auto; padding: 3px 0; gap: 10px; align-items: center; }
  .who.compact .who-name { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; }
  .who.compact .who-doing { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .adot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, .55); flex: none; }
  .folded { padding: 6px 8px; }
  #agents:not(:empty) + #agentsFolded .folded { margin-top: 14px; }
  .folded ul { margin: 0; padding: 0; list-style: none; columns: 440px; column-gap: 14px; }
  .folded li { border-bottom: 1px dashed var(--line); min-width: 0; break-inside: avoid; }
  .rowbtn { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 0; border-radius: 4px; padding: 4px 4px; text-align: left; min-width: 0; }
  .rowbtn:hover { background: var(--panel-2); }
  .rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rowbtn .nm { font-weight: 650; flex: none; min-width: 64px; }
  .rowbtn .doing { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs .fold { margin-left: auto; }
  /* Tabs within tabs: level 1 the sections (underlined), level 2 a segmented row, level 3 filter chips (.afilter, .tab);
     every tab is a link (#/village/tasks/failed, #/members/Ada/mind) and keeps its place whether its feature is on or off */
  nav.l1 { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav.l1 a { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 15px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  nav.l1 a:hover { color: var(--text); }
  nav.l1 a[aria-current="page"] { color: var(--text); font-weight: 650; border-bottom-color: var(--accent); }
  .badge { font-size: 11px; font-weight: 650; line-height: 18px; color: var(--bg); background: var(--bad); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  .badge.warn { background: var(--warn); }
  .ncnt { font-size: 12px; font-weight: 400; color: var(--muted); }
  .l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 14px; }
  .l2:empty { display: none; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg a { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: 7px; border: 1px solid transparent; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .seg a:hover { color: var(--text); }
  .seg a[aria-current="page"] { background: var(--panel); border-color: var(--line); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
  .seg .off { font-size: 10px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .card .seg { margin: 10px 0 12px; }
  nav.l1 a:focus-visible, .seg a:focus-visible, a.mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .flexrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .flexrow > .wide { flex: 999 1 560px; min-width: 0; }
  .flexrow > .narrow { flex: 1 1 340px; min-width: 0; }
  .flexrow > .card, .flexrow > .wide > .card { min-width: 0; }
  #ovMap { flex: 1.6 1 560px; }
  #ovWho { flex: 1 1 430px; }
  .offbox { padding: 26px 20px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); }
  .offbox b { display: block; margin-bottom: 4px; color: var(--text); }
  .mlist { flex: 1 1 290px; max-width: 360px; padding: 10px 8px; }
  a.mrow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; color: var(--text); text-decoration: none; min-width: 0; }
  a.mrow:hover { background: var(--panel-2); }
  a.mrow[aria-current="page"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  a.mrow .nm { font-weight: 650; flex: none; min-width: 56px; }
  a.mrow .doing { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12.5px; }
  .attn { margin: 0; padding: 0; list-style: none; }
  .attn li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .attn li:last-child { border-bottom: 0; }
  .attn .kind { flex: none; font-size: 10.5px; font-weight: 650; color: var(--bg); background: var(--warn); border-radius: 4px; padding: 0 6px; }
  .attn .kind.bad { background: var(--bad); }
  .attn .kind.info { background: var(--info); }
  .happened .kind { display: inline-block; width: 58px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 6px 24px; }
  /* (the map's activity list overlay only on the full screen: the overview shows who is doing what beside it) */
  #worldmap .card:not(.wm-full):not(:fullscreen) .wm-acts { display: none; }
  #worldmap h2 { margin-top: 0; }
  @media (max-width: 700px) {
    /* (level 1 becomes a bottom bar on a phone) */
    nav.l1 { position: fixed; top: auto; bottom: 0; left: 0; right: 0; padding: 0; border-bottom: 0; border-top: 1px solid var(--line); }
    nav.l1 a { flex: 1; justify-content: center; flex-direction: column; gap: 0; min-height: 54px; padding: 0 2px; font-size: 11.5px; border-bottom: 0; border-top: 2px solid transparent; }
    nav.l1 a[aria-current="page"] { border-top-color: var(--accent); }
    nav.l1 .badge, nav.l1 .ncnt { font-size: 9.5px; line-height: 14px; padding: 0 4px; }
    body { padding-bottom: 60px; }
    .seg { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
    /* (the member chosen first, the list under it; and a header of one or two rows) */
    .mlist { max-width: none; order: 2; }
    #mcWatch, #updated { display: none; }
    header h1 { font-size: 15px; }
  }
  @media (max-width: 700px) {
    .key-icons, .key-ground { grid-template-columns: 1fr; }
    .vgrid { grid-template-columns: 1fr; }
    .vhead { grid-template-columns: 1fr; }
    .stat { justify-items: start; }
    .stock-row { grid-template-columns: 1fr; gap: 2px; }
    .grid { grid-template-columns: 1fr; }
    .folded ul { columns: 1; }
    main { padding: 12px 16px; }
    .feed li { grid-template-columns: 1fr; gap: 0; }
    input[type=text] { width: 120px; }
    canvas.world { height: min(560px, 70vh); }
  }
</style>
</head>
<body>
<header>
  <h1>Agent control panel</h1>
  <span class="chip" id="world"><span class="dot"></span> connecting…</span>
  <span id="villagePick"></span>
  <span class="sub" id="clock"></span>
  <span class="spacer"></span>
  <span class="chip" id="usage" hidden></span>
  <span class="chip" id="mcWatch" hidden>watch as <input type="text" id="player" placeholder="your player name" aria-label="Your Minecraft player name"></span>
  <button id="pause" title="Stop or resume refreshing">Pause</button>
  <button id="theme" title="Switch light and dark">Theme</button>
  <span class="sub" id="updated">–</span>
</header>
<nav class="l1" id="l1" aria-label="Panel sections"></nav>
<main>
  <div id="error"></div>
  <div class="l2" id="l2"></div>
  <div id="view"></div>
  <!-- (the overview's map row stays in the page: the map's canvas keeps its drag and zoom across the 1 s redraws) -->
  <div class="flexrow" id="ovRow" hidden>
    <div class="wide" id="ovMap">
    <section id="worldmap" hidden>
      <h2>World map <span class="sub" id="wmInfo" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="card">
        <div class="wm-bar">
          <button id="wmAuto" class="tab-like" title="Keep every agent and its village in view, zooming out and in as they move; panning or zooming by hand turns it off">Auto on</button>
          <button id="wmFit" title="Show every chunk the bots have seen">Fit</button>
          <button id="wmHome" title="Centre on the running agents' village">Agents</button>
          <button id="wmIn" title="Zoom in">+</button>
          <button id="wmOut" title="Zoom out">&minus;</button>
          <button id="wmFull" title="Show the map on the whole screen (Esc returns)">Fullscreen</button>
          <button id="wmTrail" title="How far back the agents' trails go (the page keeps them while it is open)">Trail</button>
          <span class="sub">drag to pan, wheel to zoom (either turns Auto off); north is up</span>
        </div>
        <div class="wm-box">
          <canvas class="world" id="wmCanvas" aria-label="Map of every chunk the bots have seen, with the villages and agents"></canvas>
          <div class="wm-acts" id="wmActs" aria-live="off"></div>
          <div class="wm-key" id="wmKey"><button type="button" id="wmKeyToggle" aria-expanded="true" title="Show or hide the key">Key</button><div id="wmKeyBody"></div></div>
          <div class="wm-tip" id="wmTip" hidden></div>
        </div>
      </div>
    </section>
    </div>
    <div class="narrow card" id="ovWho"></div>
  </div>
  <div id="ovBottom"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const STATE_COLORS = { planning: 'var(--planning)', thinking: 'var(--thinking)', acting: 'var(--acting)', waiting: 'var(--waiting)', idle: 'var(--idle)', done: 'var(--done)', 'backing off': 'var(--backoff)' };
let paused = false, world = null, lastData = null;
const openDetails = new Set(JSON.parse(store.get('panel.open', '[]')));

const theme = store.get('panel.theme', '');
if (theme) document.documentElement.dataset.theme = theme;
$('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  store.set('panel.theme', next);
};
// ---- tabs within tabs: the section (level 1), its sub-tab (level 2) and filter chips inside (level 3, openTabs['l3:...']).
// Every tab has an address (#/village/tasks/failed, #/members/Ada/mind); each section remembers its last sub-tab ----
const L1 = [['overview', 'Overview'], ['village', 'Village'], ['members', 'Members'], ['society', 'Society'], ['economy', 'Economy'], ['run', 'Run']];
const L2 = {
  village: [['buildings', 'Buildings'], ['tasks', 'Tasks'], ['storage', 'Storage'], ['life', 'Life'], ['tech', 'Tech'], ['ladder', 'Ladder'], ['land', 'Land']],
  members: [['now', 'Now'], ['mind', 'Mind'], ['social', 'Social'], ['character', 'Character'], ['chores', 'Chores'], ['model', 'Model'], ['log', 'Log']],
  society: [['votes', 'Votes'], ['initiatives', 'Initiatives'], ['proposals', 'Proposals'], ['rules', 'Rules'], ['people', 'People'], ['relations', 'Relations'], ['needs', 'Needs'], ['culture', 'Culture']],
  economy: [['market', 'Market'], ['wealth', 'Wealth'], ['board', 'Board'], ['research', 'Research'], ['goals', 'Goals']],
  run: [['busy', 'Busy'], ['scorecard', 'Scorecard'], ['choices', 'Choices'], ['cost', 'Models and cost'], ['events', 'Events'], ['foundry', 'Foundry'], ['flags', 'Flags']],
};
const route = (() => {
  let s = {};
  try { s = JSON.parse(store.get('panel.route', '{}')) || {}; } catch {}
  const r = { top: 'overview', sub: { village: 'buildings', members: 'now', society: 'votes', economy: 'market', run: 'busy' }, member: String(s.member || ''), village: String(s.village || '') };
  if (L1.some(([id]) => id === s.top)) r.top = s.top;
  for (const [top, subs] of Object.entries(L2)) if (subs.some(([id]) => id === s.sub?.[top])) r.sub[top] = s.sub[top];
  return r;
})();
/** The route from the address; old #simple and #detailed links open the overview and the members. */
function readHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return;
  if (h === 'simple') { route.top = 'overview'; return; }
  if (h === 'detailed') { route.top = 'members'; return; }
  const p = h.split('/').map((s) => { try { return decodeURIComponent(s); } catch { return s; } });
  if (!L1.some(([id]) => id === p[0])) return;
  route.top = p[0];
  const ok = (id) => (L2[p[0]] || []).some(([s]) => s === id);
  if (p[0] === 'members') { if (p[1]) route.member = p[1]; if (ok(p[2])) route.sub.members = p[2]; }
  else if (ok(p[1])) {
    route.sub[p[0]] = p[1];
    if (p[1] === 'tasks' && TASK_FILTERS.some(([id]) => id === p[2])) openTabs['l3:tasks'] = p[2];
  }
}
const saveRoute = () => store.set('panel.route', JSON.stringify(route));
/** A tab's address: a section (its remembered sub-tab), a sub-tab, or a member's sub-tab. */
function hrefOf(top, sub, member) {
  if (top === 'members') return `#/members/${encodeURIComponent(member ?? route.member)}/${sub || route.sub.members}`;
  return L2[top] ? `#/${top}/${sub || route.sub[top]}` : `#/${top}`;
}
/** Fetch what the open tab shows and nothing else (model calls, memory, votes, the member's map). */
const kick = () => { refreshMaps(); refreshCalls(); refreshExtras(); };
window.addEventListener('hashchange', () => {
  readHash(); saveRoute();
  if (lastData) render(lastData);
  window.scrollTo(0, 0);
  kick();
});
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
$('player').value = store.get('panel.player', '');
$('player').onchange = () => store.set('panel.player', $('player').value.trim());

function ago(ms) {
  if (!ms) return '';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
}
/** A length of time (a village's age): "45s", "12m", "2h 14m", "3d 4h". */
function span(ms) {
  const m = Math.floor(Math.max(0, ms) / 60000);
  return m < 1 ? `${Math.floor(Math.max(0, ms) / 1000)}s` : m < 60 ? `${m}m` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h`;
}
const bar = (v, max, color) => `<span class="bar" title="${v}/${max}"><i style="width:${Math.max(0, Math.min(100, (v / max) * 100))}%;background:${color}"></i></span>`;
const fmtTok = (n) => (n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(1) + 'k' : (n / 1e6).toFixed(2) + 'M');
const fmtArgs = (args) => Object.entries(args || {}).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
const det = (key, title, body, openByDefault = false) => {
  const open = openDetails.has(key) || (openByDefault && !openDetails.has('!' + key));
  return `<details data-key="${esc(key)}" ${open ? 'open' : ''}><summary>${title}</summary>${body}</details>`;
};

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path}: ${res.status} ${(await res.text()).slice(0, 200)}`);
  return res.json();
}

function renderPlan(p) {
  if (!p) return '<div class="empty">no plan yet</div>';
  const steps = p.steps || [];
  const list = steps.length
    ? `<ol class="steps">${steps.map((s, i) => `<li class="${i < p.step ? 'done' : i === p.step ? 'cur' : 'todo'}">${esc(s)}</li>`).join('')}</ol>`
    : '<div class="empty">no steps: waiting</div>';
  return `<div><b>${esc(p.goal)}</b> <span class="sub">by ${esc(p.by || '?')}</span></div>${list}`;
}

function renderStats(s) {
  if (!s) return '<div class="empty">no model calls yet</div>';
  const n = (k) => s[k] ?? 0;
  const tier = (k) => `${n(k + 'Calls')} calls, avg ${Math.round(n(k + 'MsAvg') / 100) / 10}s, ~${n(k + 'PromptTokensAvg')} in / ${n(k + 'OutTokensAvg')} out tokens`;
  const sum = (suffix) => ['plan', 'design', 'exec'].reduce((t, k) => t + n(k + suffix), 0);
  return `<dl class="kv">
    <dt>planner</dt><dd>${tier('plan')}</dd>
    ${n('designCalls') > 0 ? `<dt>designer</dt><dd>${tier('design')}</dd>` : ''}
    <dt>executor</dt><dd>${tier('exec')}</dd>
    <dt>tokens</dt><dd>${fmtTok(sum('PromptTokensTotal'))} in / ${fmtTok(sum('OutTokensTotal'))} out${n('budgetRefused') ? `, ${n('budgetRefused')} refused by the budget` : ''}</dd>
    <dt>actions</dt><dd><span style="color:var(--good)">${n('actionsDone')} done</span>, <span style="color:var(--bad)">${n('actionsFailed')} failed</span>, ${n('repeatsRefused')} repeats refused</dd>
    <dt>steps</dt><dd>${n('stepsDone')} done (${n('stepsAutoDone')} marked automatically)</dd>
    ${s.designs || s.designsFailed ? `<dt>designs</dt><dd>${n('designs')} drawn, ${n('designsFailed')} failed</dd>` : ''}
  </dl>`;
}

// Getting a stuck bot out (real Minecraft): how often, and the last time
function renderRescues(r) {
  if (!r) return '';
  return `<dl class="kv"><dt>rescues</dt><dd>${r.walked ?? 0} walked out, ${r.climbed ?? 0} climbed out, <span style="color:${r.teleported ? 'var(--bad)' : 'inherit'}">${r.teleported ?? 0} teleported</span>${r.failed ? `, ${r.failed} failed` : ''}${r.last ? `<div class="sub">${esc(r.last)}</div>` : ''}</dd></dl>`;
}

// Level 3: filter chips inside a tab (a second click keeps the chip; the choice is remembered per browser)
const openTabs = (() => { try { return JSON.parse(store.get('panel.tabs', '{}')) || {}; } catch { return {}; } })();
const chipOf = (key, def) => openTabs[key] || def;
function chipRow(key, def, items, label = 'Filter') {
  const cur = chipOf(key, def);
  return `<div class="afilter" role="group" aria-label="${esc(label)}">${items.filter(Boolean).map(([id, text, n]) =>
    `<button type="button" class="tab${cur === id ? ' on' : ''}" aria-pressed="${cur === id}" data-tabkey="${esc(key)}" data-tab="${esc(id)}" data-keep="1">${text}${n != null ? ` <span class="cnt">${n}</span>` : ''}</button>`).join('')}</div>`;
}
/** The member the Members tab shows: the one in the address, else the first (the mayor). */
function selectedAgent(d = lastData) {
  const as = (d && d.agents) || [];
  return as.find((a) => a.name === route.member) || as.slice().sort(byAgent)[0] || null;
}
/** What the open member tab needs fetched: its map, memory, votes, a model call. */
function memberNeeds() {
  if (route.top !== 'members') return new Set();
  return new Set({ now: ['map'], mind: ['mind'], social: ['mind', 'votes'], character: ['character'], chores: ['mind', 'choice'], model: [chipOf('l3:model', 'thoughts')], log: [] }[route.sub.members] || []);
}

/** One member: what it is doing, its vitals and actions, then its sub-tabs (Now, Mind, Social, Chores, Model, Log). */
function memberView(a) {
  const st = a.status || { state: agentState(a), detail: a.brain ? '' : 'no brain: controlled through the API' };
  const color = STATE_COLORS[st.state] || 'var(--idle)';
  const invList = a.inventory || [];
  const sub = route.sub.members;
  const s = a.stats || {};
  const n = (x) => s[x] ?? 0;
  const cur = a.currentAction;
  const where = a.position ? `${Math.round(a.position.x)}, ${Math.round(a.position.y)}, ${Math.round(a.position.z)}` : '?';
  const watch = world?.kind === 'minecraft' ? `<button data-act="watch" data-agent="${esc(a.name)}" title="Spectate this agent in the game">Watch in game</button>` : '';
  const r = st.reasoning;
  const models = st.models ? `${esc(st.models.exec)} (executor), ${esc(st.models.plan)} (planner)${st.models.design ? `, ${esc(st.models.design)} (designer)` : ''}` +
    (r ? ` · reasoning exec ${esc(r.exec)}, plan ${esc(r.plan)}, design ${esc(r.design)}` : '') : '';
  const mind = mindParts(a);
  const label = (t, extra = '') => `<div class="label">${t}${extra ? ` <span class="sub">${extra}</span>` : ''}</div>`;
  let body = '';
  if (sub === 'now') {
    const inv = invList.map(([nm, c]) => `<span class="tag">${esc(nm)} ${c}</span>`).join('') + (a.inventoryKinds > invList.length ? ` <span class="sub">+${a.inventoryKinds - invList.length} more</span>` : '');
    const blocked = (st.blockedCalls || []).map((b) => `<li>${esc(b)}</li>`).join('');
    body = `<div class="flexrow"><div class="wide">
        ${a.today ? `${label('Today\'s intention')}<div>${esc(a.today.text)}</div>` : ''}
        ${a.objective ? `${label('Objective')}<div>${esc(a.objective)}</div>` : ''}
        ${a.task ? `${label(`Task ${esc(a.task.id)} (${esc(a.task.status)})`)}<div><b>${esc(a.task.title)}</b>: ${esc(a.task.detail)}</div>` : ''}
        ${label('Plan')}${renderPlan(a.plan)}
        ${blocked ? `${label('Blocked calls', '(failed twice, refused for 5 min)')}<ul class="list mono">${blocked}</ul>` : ''}
        ${label('Inventory', `${a.inventoryKinds ?? 0} kinds`)}${a.holding ? `<div class="sub">holding ${esc(a.holding)}</div>` : ''}${inv || '<div class="empty">empty</div>'}
      </div>
      <div class="mapwrap">
        <canvas class="map" width="196" height="196" data-map="${esc(a.name)}" title="Top-down view, north up, about 49 blocks across"></canvas>
        <div class="legend">
          <i style="background:#fff;border:1px solid #000"></i><span>${esc(a.name)} (arrow: facing)</span>
          <i style="background:#e0453a"></i><span>hostile mob</span>
          <i style="background:#f2c14e"></i><span>animal</span>
          <i style="background:#39c5d6"></i><span>player or agent</span>
          <i style="border:2px solid #e14fd8"></i><span>current target</span>
          <i style="border:2px solid #4cc27f"></i><span>prepared plot</span>
          <i style="background:rgba(140,90,40,.55);border:1px solid #8c5a28"></i><span>building</span>
          <i style="border:2px dashed #f39c34"></i><span>ground being worked</span>
        </div></div></div>`;
  } else if (sub === 'mind') body = mind.state || `${mind.persona}${mind.journal || '<div class="empty">no journal (MC_MEMORY off)</div>'}${mind.fields}`;
  else if (sub === 'social') body = (mind.state || mind.social || '<div class="empty">nothing social recorded (MCAI_SOCIAL off, or nobody met yet)</div>')
    + (a.village ? `${label('Its ballots')}${votesBody(a.village, a.name)}` : '');
  else if (sub === 'character') body = characterBody(a);
  else if (sub === 'chores') body = `${label('Its last chore menu')}${choiceBody(a)}${mind.state || `${mind.temper}${mind.chores}`}`;
  else if (sub === 'model') {
    const m = chipOf('l3:model', 'thoughts');
    const decisions = (st.recentDecisions || []).slice().reverse().map((x) => `<li>${esc(x)}</li>`).join('');

/** The Members tab: the list (by activity, with its filter chips) and the member chosen. */

// The last model calls in full (prompt and reply), fetched per agent only while its "saw" tab is open: the overview
// carries just their time and tokens (E.1). An agent server from before E.1 still sends them whole in the overview.
const fullCalls = new Map();
/** The call to show: the overview's own when it is whole, else the fetched one (null while it is on its way). */
function fullCall(name, kind, summary) {
  if (!summary || summary.prompt !== undefined) return summary;
  const f = fullCalls.get(name);
  return (f && f[kind]) || { ...summary, loading: true };
}
/** The member shown, when its open tab shows a "saw" call with only the summary in the overview, or its chore menu. */
async function refreshCalls() {
  if (paused || !lastData) return;
  const need = memberNeeds(), sel = selectedAgent();
  const want = sel ? [sel].filter((a) => {
    const s = need.has('exec') ? a.status?.lastExecutorCall : need.has('planner') ? a.status?.lastPlannerCall : null;
    return s && s.prompt === undefined;
  }) : [];
  // (A2: the chore menu's decision, fetched again only when the agent's last decision is another one)
  const wantChoice = sel && need.has('choice') && sel.choice && fullDecisions.get(sel.name)?.key !== choiceKey(sel.choice) ? [sel] : [];
  if (!want.length && !wantChoice.length) return;
  await Promise.all([...want.map(async (a) => {
    try { fullCalls.set(a.name, await api(`/api/agents/${encodeURIComponent(a.name)}/calls`)); } catch {}
  }), ...wantChoice.map(async (a) => {
    try { fullDecisions.set(a.name, { ...(await api(`/api/agents/${encodeURIComponent(a.name)}/decision`)), key: choiceKey(a.choice) }); } catch {}
  })]);
  if (lastData) render(lastData);
}

// ---- A2: chore choices (idle members of a complete village choose their next chore, by the model or the fixed order) ----
// The last decision in full (menu, facts, order shown, prompt), fetched per agent only while its Choice tab is open: the

const fullDecisions = new Map();

const FALLBACK_WORDS = { off: 'choosing is off', budget: 'the token budget was spent', rate: 'the rate limit', queue: 'no turn in the queue in time',

}

/** The Choice tab: the last menu in the order shown, the chosen option marked, the reason, how it was decided, tokens. */

    <span class="sub mono">${esc(o.id)}${o.rank != null ? ` · rank ${o.rank}` : ''}${o.lp != null ? ` · lp ${Math.round(o.lp * 100) / 100}` : ''}</span>
    ${o.facts ? `<div class="sub">${esc(o.facts)}</div>` : ''}${o.effect ? `<div class="sub">→ ${esc(o.effect)}</div>` : ''}</li>`).join('');

      <dt>decided</dt><dd>${ago(d.at)} ago</dd>

      <dt>chose</dt><dd>${d.chosen ? `<b>${esc(chosen?.name || d.chosen)}</b>${chosen ? '' : ' <span class="sub">(from a fresh menu)</span>'}` : '<span class="sub">nothing was queued</span>'}</dd>
      ${d.reason && d.reason !== 'fixed order' ? `<dt>reason</dt><dd>${esc(d.reason)}</dd>` : ''}

    ${guarded ? det(`choice:guarded:${a.name}`, `Kept off the menu (${(d.menu?.guarded || []).length})`, `<ul class="list">${guarded}</ul>`) : ''}

/** The village's decisions in one chip: by source, the failures, and how often the first option shown was chosen. */
function choicesChip(v) {
  const s = v.choices;

  const fails = Object.entries(s.fallback || {}).filter(([, n]) => n > 0);
  const nFail = fails.reduce((t, [, n]) => t + n, 0);
  const parts = [`model ${s.model}`, `fixed ${s.fixed}`, s.only && `only ${s.only}`, s.repeat && `repeat ${s.repeat}`, s.rate && `rate ${s.rate}`,
    nFail && `fallback ${nFail} (${fails.map(([k, n]) => `${k} ${n}`).join(', ')})`, s.drops && `dropped ${s.drops}`].filter(Boolean);
  // Position bias: the model's picks by the shown position against chance (expected[p] sums 1/n over its menus of n > p)
  const pos = s.positions || [], exp = s.expected || [];
  const total = pos.reduce((t, n) => t + (n || 0), 0);
  const pct = (x) => `${Math.round((x / total) * 100)}%`;
  const bias = total ? `; first shown chosen ${pct(pos[0] || 0)} (chance ${pct(exp[0] || 0)})` : '';
  const title = [total ? `chosen by shown position: ${pos.map((n, i) => `${i + 1}: ${n || 0} (chance ${Math.round((exp[i] || 0) * 10) / 10})`).join(', ')}` : '',
    `tokens ${fmtTok(s.promptTokens || 0)} in / ${fmtTok(s.outputTokens || 0)} out`, s.msP50 ? `model answer p50 ${Math.round(s.msP50 / 100) / 10} s` : '',
    s.queueWaitP90 ? `wait p90 ${Math.round(s.queueWaitP90 / 100) / 10} s` : ''].filter(Boolean).join('; ');
  return `<span class="chip choices" title="${esc(title)}">chores chosen: ${esc(parts.join(', '))}${esc(bias)}</span>`;
}
/** The last model call: the prompt and the answer. */
function seenBody(c) {

  const calls = (c.calls || []).map((x) => `<li>${esc(x.name)}(${esc(JSON.stringify(x.input))})</li>`).join('');
  const head = `<div class="sub">${esc(c.model)}${c.ms != null ? `, ${Math.round(c.ms / 100) / 10}s` : ''}${c.promptTokens ? `, ${c.promptTokens} prompt tokens` : ''}${c.outputTokens != null ? `, ${c.outputTokens} output tokens` : ''}${c.think ? `, reasoning ${esc(c.think)}` : ''}, ${ago(c.at)} ago; the fixed system prompt for its role is not shown</div>`;
  if (c.loading) return `${head}<div class="empty">fetching the prompt and the reply…</div>`;
  return `${head}
    <pre class="prompt" data-scroll="prompt:${esc(String(c.at))}">${esc(c.prompt)}</pre>
    ${c.thinking ? det('seen:thinking', "model's reasoning", `<pre class="prompt" data-scroll="thinking:${esc(String(c.at))}">${esc(c.thinking)}</pre>`) : ''}

}

// ---- s34: votes, an agent's thoughts and what it carries. Fetched only while their tab is open, every 8 s at most ----
const extraData = new Map(); // key -> { at, data, err }
const EXTRA_MS = 8000;
async function fetchExtra(key, path) {
  const e = extraData.get(key);
  if (e && Date.now() - e.at < EXTRA_MS) return false;
  extraData.set(key, { ...(e || {}), at: Date.now() });
  try { extraData.set(key, { at: Date.now(), data: await api(path) }); }
  catch (err) { extraData.set(key, { at: Date.now(), data: e && e.data, err: String((err && err.message) || err) }); }
  return true;
}
async function refreshExtras() {
  if (paused || !lastData) return;
  const jobs = [];
  const mind = (name) => fetchExtra(`mind:${name}`, `/api/agents/${encodeURIComponent(name)}/mind`);
  const votes = (vn) => fetchExtra(`votes:${vn}`, `/api/votes?village=${encodeURIComponent(vn)}`);
  const need = memberNeeds(), a = selectedAgent();
  if (a) {
    if (need.has('thoughts')) jobs.push(fetchExtra(`thoughts:${a.name}`, `/api/agents/${encodeURIComponent(a.name)}/thoughts`));
    if (need.has('mind')) jobs.push(mind(a.name));
    if (need.has('votes') && a.village) jobs.push(votes(a.village));
    // (character v2: the member in full, its series included)
    if (need.has('character')) jobs.push(fetchExtra(`char:${a.name}`, `/api/agents/${encodeURIComponent(a.name)}/character`));
  }
  // (the village's proposals and rules come with any member's memory view; Run > Flags reads its modes from it too)
  const v = curVillage(lastData), sub = route.sub[route.top];
  if (v && route.top === 'society' && sub === 'votes') jobs.push(votes(v.name));
  // (G8: the ladder of ages)
  if (v && route.top === 'village' && sub === 'ladder') jobs.push(fetchExtra(`ladder:${v.name}`, `/api/ladder?village=${encodeURIComponent(v.name)}`));
  const vm = v && villageMember(v);
  if (vm && ((route.top === 'society' && (sub === 'proposals' || sub === 'rules')) || (route.top === 'run' && sub === 'flags'))) jobs.push(mind(vm.name));
  // (character v2: every member compact for People, the matrix and quartiles for Relations and the Overview's mood card)
  if (v && route.top === 'society' && (sub === 'people' || sub === 'relations')) jobs.push(fetchExtra(`charv:${v.name}`, `/api/character?village=${encodeURIComponent(v.name)}`));
  if (v && route.top === 'overview') jobs.push(fetchExtra(`charv:${v.name}`, `/api/character?village=${encodeURIComponent(v.name)}`));
  if (v && ((route.top === 'society' && sub === 'relations') || route.top === 'overview')) jobs.push(fetchExtra(`chars:${v.name}`, `/api/character/series?village=${encodeURIComponent(v.name)}&matrix=${route.top === 'society' ? 1 : 0}`));
  if (!jobs.length) return;
  if ((await Promise.all(jobs)).some(Boolean) && lastData) render(lastData);
}
// ---- character v2 (spec 14): a member's layers, the village's people and relations; data from /api/character* ----
const TRAIT_LEVER = { H: 'honesty-humility: measured against what it keeps for itself', E: 'emotionality: pens and home; feels bad things more', X: 'extraversion: help and shared work; pulled toward others', A: 'agreeableness: help; takes requests more readily, forgives sooner', C: 'conscientiousness: gathering, making, farming', O: 'openness: exploring, new crafts, lighting, works' };
const VALUE_WORDS = { openness: 'openness to change', conservation: 'tradition and order', enhancement: 'getting ahead', transcendence: 'the good of others' };
/** A bar from -1..1 (traits) or 0..1 (values). */
const charBar = (x, signed) => {
  const pct = signed ? Math.round(((x + 1) / 2) * 100) : Math.round(x * 100);
  return `<span style="display:inline-block;width:120px;height:8px;background:var(--line);vertical-align:middle;position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:${Math.max(0, Math.min(100, pct))}%;background:var(--accent)"></span></span> <span class="mono sub">${signed && x > 0 ? '+' : ''}${Number(x).toFixed(2)}</span>`;
};
/** A small line of a series (values in `lo..hi`). */
function spark(points, lo, hi, w = 240, h = 36) {
  if (!points.length) return '<span class="sub">no points yet</span>';
  const t0 = points[0][0], t1 = points[points.length - 1][0] || t0 + 1;
  const xy = points.map(([t, y]) => `${Math.round(((t - t0) / Math.max(1, t1 - t0)) * w)},${Math.round(h - ((Math.max(lo, Math.min(hi, y)) - lo) / (hi - lo)) * h)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="series"><line x1="0" x2="${w}" y1="${Math.round(h - ((0 - lo) / (hi - lo)) * h)}" y2="${Math.round(h - ((0 - lo) / (hi - lo)) * h)}" class="util-grid"/><polyline points="${xy.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}
/** Members -> Character: the identity line as the model sees it, traits and values with what they lever, energy and
 *  mood with their series and the feelings behind mood, affinities with their facts, every prompt line as last written. */
function characterBody(a) {
  const st = extraState(`char:${a.name}`);
  if (st) return st;
  const d = extraData.get(`char:${a.name}`).data;
  const label = (t, extra = '') => `<div class="label">${t}${extra ? ` <span class="sub">${extra}</span>` : ''}</div>`;
  const col = (k) => (d.columns || []).indexOf(k);

    + `${label('Values', `life goal from values: ${esc(d.goalFromValues || '')}`)}<ul class="list">${Object.entries(d.values || {}).map(([k, x]) => `<li class="sub"><b>${esc(VALUE_WORDS[k] || k)}</b> ${charBar(x, false)}</li>`).join('')}</ul>`

    + `${label('Character factor', 'its decisions\' mean, a minute')}${spark(series('factor'), 0.67, 1.5)}`
    + `${label('Affinity', 'from verified facts, -10..10')}<ul class="list">${(d.affinity || []).map((x) => `<li class="sub"><b>${esc(x.of)}</b> ${x.a > 0 ? '+' : ''}${x.a}${x.word ? ` (${esc(x.word)})` : ''}${x.facts ? ` <span class="sub">kept ${x.facts.kept}, broke ${x.facts.broke}, helped ${x.facts.helped}, helped by ${x.facts.helpedBy}, accepted ${x.facts.accepted}, refused ${x.facts.refused}, beside ${x.facts.beside}</span>` : ''}</li>`).join('') || '<li class="empty">none yet</li>'}</ul>`
    + `${label('Prompt lines', 'as last written')}<dl class="kv">${Object.entries(lines).filter(([, x]) => x).map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x)}</dd>`).join('') || '<dd class="sub">none yet</dd>'}</dl>`

}
/** Society -> People: one row a member: its strongest traits, top value, goal, energy and mood now, strongest friendship. */

    `<table class="streets"><tr><th>member</th><th>strongest traits</th><th>top value</th><th>goal</th><th>energy</th><th>mood</th><th>strongest friend</th></tr>${rows}</table>`);
}
/** Society -> Relations: the latest affinity matrix (cells coloured by sign), and the village's mood over time. */
/** G8's Ladder view: the current rung and stage, every rung's stages with who did their work and when each ended, the
 *  tools given to members, the iron level, the rung ballots. */
function ladderBody(v) {
  const st = extraState(`ladder:${v.name}`);
  if (st) return st;
  const d = extraData.get(`ladder:${v.name}`).data;
  if (!d.on) return offBox('The ladder is off', 'Start the agent server with MC_LADDER=on (and MC_IRON_AGE=on for the iron work) to climb the ladder of ages.');
  const L = d.ladder;
  if (!L) return offBox('No ladder yet', 'The ladder begins on the iron age once the village is complete.');
  const who = (w) => Object.entries(w || {}).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n, q]) => `${esc(n)} ${q}`).join(', ') || '<span class="sub">nobody yet</span>';
  const cur = L.rungs.find((r) => r.current);
  const sc = cur && cur.stages[L.stage];
  const bar = sc && sc.target ? `<div style="height:8px;background:var(--line);border-radius:4px;margin:6px 0"><div style="height:8px;width:${Math.round(100 * L.count / sc.target)}%;background:var(--good);border-radius:4px"></div></div>` : '';
  const head = cur ? `<b>${esc(cur.name)}</b>, stage ${L.stage + 1} of 4: ${esc(sc.words)}${bar}<span class="sub">stage begun ${ago(L.stageStart)} ago</span>`
    : L.offered.length ? `Choosing the next ambition among ${L.offered.map(esc).join(', ')}` : 'No rung under way';
  const news = L.news ? `<div class="sub" style="margin-top:6px">${esc(L.news.text)} (${ago(L.news.t)} ago)</div>` : '';
  const rows = L.rungs.filter((r) => r.current || r.reached || r.stages.some((s) => Object.keys(s.work).length)).map((r) => card(
    `${esc(r.name)} <span class="sub">${r.reached ? `reached ${ago(r.reached.t)} ago${r.reached.day !== undefined && r.reached.day !== null ? `, day ${r.reached.day}` : ''}` : r.current ? 'under way' : ''}</span>`,
    `<table class="grid"><tr><th>Stage</th><th>State</th><th>Ended</th><th>Who did the work</th></tr>${r.stages.map((s, i) => `<tr><td>${i + 1}. ${esc(s.words)}</td><td>${s.state}</td><td>${s.ended ? `${ago(s.ended)} ago` : ''}</td><td>${who(s.work)}</td></tr>`).join('')}</table>`)).join('');
  const later = L.rungs.filter((r) => !r.current && !r.reached).map((r) => `${esc(r.name)}${r.after.length ? ` <span class="sub">(after ${r.after.join(', ')})</span>` : ''}`).join(' · ');
  const given = d.given.length ? `<table class="grid"><tr><th>Tool</th><th>To</th><th>By</th><th>When</th></tr>${d.given.slice(-20).reverse().map((g) => `<tr><td>${esc(g.item.replace(/_/g, ' '))}</td><td>${esc(g.to)}</td><td>${esc(g.by)}</td><td>${ago(g.at)} ago</td></tr>`).join('')}</table>` : '<span class="sub">none given yet</span>';
  const iron = d.iron ? `level y ${d.iron.level ?? '?'}, ${d.iron.dug} cells dug in all, ${d.iron.legs} legs${d.iron.finished ? `; finished: ${esc(d.iron.finished)}` : ''}` : 'not started';
  const ballots = L.ballots.length ? L.ballots.map((b) => `${ago(b.t)} ago: ${esc(b.winner || '?')} won among ${b.options.map(esc).join(', ')}`).join('<br>') : '<span class="sub">none yet</span>';
  return card('The ladder of ages', head + news) + rows + card('Rungs to come', later || '<span class="sub">none</span>')
    + card('Iron tools given to members', given) + card('The iron level', iron) + card('Rung ballots', ballots);
}

function relationsBody(v) {

/** The Overview's "Village mood" card (character v2): the median mood and its quartiles over time; nothing without data. */
function villageMoodCard(v) {
  const d = extraData.get(`chars:${v.name}`)?.data;
  const pts = (d && d.points) || [];
  if (!pts.length) return '';
  const mem = extraData.get(`charv:${v.name}`)?.data?.members || [];
  const word = (x) => (x >= 10 ? ['very good', 'var(--good)'] : x >= 3 ? ['good', 'var(--good)'] : x > -3 ? ['neutral', 'var(--muted)'] : x > -10 ? ['low', 'var(--warn)'] : ['very low', 'var(--bad)']);
  const med = pts[pts.length - 1].mood[1];
  const [w, c] = word(med);
  const good = mem.filter((m) => m.mood >= 3).length, low = mem.filter((m) => m.mood <= -3).length;
  const counts = mem.length ? `${good} feel good, ${mem.length - good - low} neutral, ${low} low` : '';
  const byMood = [...mem].sort((x, y) => y.mood - x.mood);
  const who = (m) => m ? `<b>${esc(m.name)}</b> ${m.mood > 0 ? '+' : ''}${Math.round(m.mood)}${m.feelings?.[0] ? ` <span class="sub">(${esc(m.feelings[0].src)})</span>` : ''}` : '';
  // (the chart: the middle half of members as a band, the median as a line, scaled to the data, at least -10..+10)
  const W = 520, H = 70, top = Math.max(10, Math.ceil(Math.max(...pts.flatMap((p) => p.mood.map(Math.abs))) / 5) * 5);
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const X = (t) => Math.round(((t - t0) / Math.max(1, t1 - t0)) * (W - 34)) + 30;
  const Y = (y) => Math.round(4 + (H - 8) * (1 - (y + top) / (2 * top)));
  const band = `${pts.map((p) => `${X(p.t)},${Y(p.mood[2])}`).join(' ')} ${[...pts].reverse().map((p) => `${X(p.t)},${Y(p.mood[0])}`).join(' ')}`;
  const line = pts.map((p) => `${X(p.t)},${Y(p.mood[1])}`).join(' ');
  const mins = Math.round((t1 - t0) / 60000);
  const svg = `<svg width="${W}" height="${H + 14}" viewBox="0 0 ${W} ${H + 14}" role="img" aria-label="village mood over time">
    <text x="0" y="${Y(top) + 4}" class="sub" font-size="10" fill="var(--muted)">+${top}</text>
    <text x="8" y="${Y(0) + 4}" font-size="10" fill="var(--muted)">0</text>
    <text x="0" y="${Y(-top) + 4}" font-size="10" fill="var(--muted)">-${top}</text>
    <line x1="30" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>
    <polygon points="${band}" fill="var(--accent)" opacity="0.18"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="30" y="${H + 12}" font-size="10" fill="var(--muted)">${mins} min ago</text>
    <text x="${W - 22}" y="${H + 12}" font-size="10" fill="var(--muted)">now</text></svg>`;
  return card(`Village mood`, `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
    <div><div style="font-size:22px;font-weight:600;color:${c}">${w}</div><div class="sub">median ${med > 0 ? '+' : ''}${med} on -30..+30${counts ? `; ${counts}` : ''}</div>
      ${byMood.length ? `<div class="sub" style="margin-top:6px">happiest: ${who(byMood[0])}</div><div class="sub">lowest: ${who(byMood[byMood.length - 1])}</div>` : ''}</div>
    <div>${svg}<div class="sub">the line is the median member; the band holds the middle half of members</div></div></div>`);
}

/** Loading, an error, or an agent server from before these views (its routes answer 404). */
function extraState(key) {
  const e = extraData.get(key);
  if (!e || (!e.data && !e.err)) return '<div class="empty">fetching…</div>';
  if (!e.data) return `<div class="empty">${/: 404/.test(e.err) ? 'this agent server predates this view (s34): it shows after its next start' : esc(e.err)}</div>`;
  return '';
}
const preview = (x) => (typeof x === 'string' ? x : JSON.stringify(x) ?? '').slice(0, 140);
const VOTE_TOPICS = { style: 'Neighbourhood style', work: 'Public work' };
/** Votes of a village, newest first: options with their facts and tally, every ballot with its reason; with `agent`, only
 *  the votes it took part in, its own ballot first. */
function votesBody(village, agent) {
  const st = extraState(`votes:${village}`);
  if (st) return st;
  const rec = (extraData.get(`votes:${village}`).data || [])[0] || {};
  const votes = [...(rec.votes || [])].reverse();
  const pending = rec.work && rec.work.piece ? `<div class="sub">decided, not laid out yet: ${esc(rec.work.piece)}</div>` : '';
  if (!votes.length) return `${pending}<div class="empty">no vote yet</div>`;
  const rows = votes.map((vt) => {
    const nm = (id) => (vt.options.find((o) => o.id === id) || {}).name || id;
    const mine = agent ? vt.ballots.find((b) => b.agent === agent) : null;
    if (agent && !mine) return '';
    const cast = vt.ballots.filter((b) => b.choice).length;
    const max = Math.max(1, ...Object.values(vt.tally || {}));
    const ballot = (b) => `<li><b>${esc(b.agent)}</b> → ${b.choice ? esc(nm(b.choice)) : `<span class="sub">no vote (${esc(b.why || '?')})</span>`}`
      + `${b.predicted && b.predicted !== b.choice ? ` <span class="sub">(its temperament predicted ${esc(nm(b.predicted))})</span>` : ''}`
      + `${b.source === 'predicted' ? ' <span class="sub">(predicted ballot, no model call)</span>' : ''}${b.reason && b.source !== 'predicted' ? `<div class="sub">“${esc(b.reason)}”</div>` : ''}</li>`;
    const opts = vt.options.map((o) => `<li><b>${esc(o.name)}</b>${o.id === vt.winner ? ' <span class="state" style="--c:var(--done)">won</span>' : ''} `
      + `<span class="mono">${(vt.tally || {})[o.id] || 0}</span> <span style="display:inline-block;height:6px;vertical-align:middle;border-radius:3px;background:var(--accent);width:${Math.round((80 * ((vt.tally || {})[o.id] || 0)) / max)}px"></span>`
      + `<div class="sub">${esc(o.facts)}</div></li>`).join('');
    const others = vt.ballots.filter((b) => b !== mine);
    const title = `${esc(VOTE_TOPICS[vt.topic] || vt.topic)} ${esc(vt.k)}: <b>${esc(nm(vt.winner))}</b> <span class="sub">${ago(vt.closedAt || vt.at)} ago, ${cast} of ${vt.ballots.length} ballots, ${esc(vt.mode)}${vt.tie ? ', a tie drawn' : ''}${mine ? `; it voted ${mine.choice ? esc(nm(mine.choice)) : 'none'}` : ''}</span>`;
    return det(`vote:${vt.id}:${agent || ''}`, title, `${mine ? `<div class="label">Its ballot</div><ul class="list">${ballot(mine)}</ul>` : ''}<div class="label">Options</div><ul class="list">${opts}</ul>`
      + `<div class="label">${mine ? 'The others' : 'Ballots'}</div><ul class="list">${others.map(ballot).join('')}</ul>`, !agent && vt === votes[0]);
  }).join('');
  return `${pending}${rows || '<div class="empty">it has not voted yet</div>'}`;
}
/** An agent's recent model calls, newest first: what it decided at a glance, its reasoning, what it saw. */
function thoughtsBody(a) {
  const st = extraState(`thoughts:${a.name}`);
  if (st) return st;
  const calls = [...(extraData.get(`thoughts:${a.name}`).data.calls || [])].reverse();
  if (!calls.length) return '<div class="empty">no model call yet</div>';
  return `<div class="sub">its last ${calls.length} model calls, newest first (planning, acting, choosing a chore, voting...); open one for its reasoning and what it saw</div>`
    + calls.map((c) => {
      const ans = (c.calls || []).map((x) => `${x.name}(${JSON.stringify(x.input)})`).join('; ') || c.text || '';
      const head = `<b>${esc(c.kind)}</b> <span class="sub">${ago(c.at)} ago, ${Math.round(c.ms / 100) / 10}s${c.outputTokens ? `, ${c.outputTokens} tokens out` : ''}</span><div class="sub clamp">${esc(c.thinking ? `thinks: ${c.thinking.slice(0, 220)}` : '')}</div><div class="mono sub clamp">→ ${esc(ans.slice(0, 200) || '(nothing)')}</div>`;
      return det(`thought:${a.name}:${c.at}`, head, `${c.thinking ? `<div class="label">Its reasoning</div><pre class="prompt" data-scroll="th:${esc(a.name)}:${c.at}">${esc(c.thinking)}</pre>` : '<div class="sub">the model returned no reasoning</div>'}`
        + `<div class="label">It answered</div><pre class="prompt" data-scroll="ta:${esc(a.name)}:${c.at}">${esc(ans || '(nothing)')}</pre><div class="label">What it saw</div><pre class="prompt" data-scroll="tu:${esc(a.name)}:${c.at}">${esc(c.user)}</pre>`
        + det(`thought:sys:${a.name}:${c.at}`, 'its system prompt', `<pre class="prompt" data-scroll="ts:${esc(a.name)}:${c.at}">${esc(c.system)}</pre>`));
    }).join('');
}
/** What an agent carries, in the parts the member's tabs show: persona, journal and memory fields (Mind), social (Social),
 *  temperament and chores (Chores), and the village's proposals and rules (Society); { state } while it is fetched. */
function mindParts(a) {
  const st = extraState(`mind:${a.name}`);
  if (st) return { state: st };
  const d = extraData.get(`mind:${a.name}`).data;
  const t = d.temperament || {};
  const traits = t.vector ? Object.entries(t.vector).map(([k, x]) => `${esc(k)} <b>${x > 0 ? '+' : ''}${Number(x).toFixed(2)}</b>`).join(' · ') : '';
  const weights = t.weights ? Object.entries(t.weights).filter(([k]) => k !== 'eat').sort((x, y) => y[1] - x[1]).map(([k, w]) => `${esc(k)} ${w}`).join(', ') : '';
  const chores = [...(d.chores || [])].reverse().map((c) => `<li>${c.ok ? '✓' : '<span class="bad">✗</span>'} <b>${esc(c.kind)}</b> <span class="mono sub">${esc(c.id)}</span> `
    + `<span class="sub">${ago(c.at)} ago, ${c.minutes} min${c.ok && !c.productive ? ', nothing gained' : ''}${c.cut ? ', cut short' : ''}</span>${c.line ? `<div class="sub clamp">${esc(c.line)}</div>` : ''}</li>`).join('');
  const mem = d.memory || {};
  const fields = Object.keys(mem).sort().map((k) => det(`mind:${a.name}:${k}`, `<b>${esc(k)}</b> <span class="sub">${esc(preview(mem[k]))}</span>`, `<pre class="prompt" data-scroll="mf:${esc(a.name)}:${esc(k)}">${esc(JSON.stringify(mem[k], null, 2))}</pre>`)).join('');
  // (G1: its journal: the intention, live notes, record by kind, day lines and last ends)
  const j = d.journal;
  const journal = j ? `<div class="label">Journal <span class="sub">(G1${d.clock ? `; ${esc(d.clock)}` : ''}; kept across restarts)</span></div>`
    + `${j.today ? `<div><b>Intention for day ${j.today.day}</b> <span class="sub">(${esc(j.today.by)})</span>: ${esc(j.today.text)}</div>` : ''}`
    + `${j.intent ? `<div class="sub">now: ${esc(j.intent.what)}${j.intent.why ? ` (${esc(j.intent.why)})` : ''}, ${esc(j.intent.source)}</div>` : ''}`
    + `<div class="sub">notes:</div><ul class="list">${(j.notes || []).map((n) => `<li${n.replaced ? ' style="opacity:.5;text-decoration:line-through"' : ''}><span class="mono sub">${esc(n.id)}</span> ${esc(n.text)} <span class="sub">day ${n.day}, ${ago(n.t)} ago, ${esc(n.by)}, shown ${n.shown}</span></li>`).join('') || '<li class="empty">none</li>'}</ul>`
    + `<div class="sub">record: ${esc(Object.entries(j.kinds || {}).sort((x, y) => y[1].n - x[1].n).map(([k, r]) => `${k} ${r.n} (${r.productive})`).join(', ') || 'none')}</div>`
    + `${(j.days || []).length ? `<div class="sub">days:</div><ul class="list">${j.days.slice(-6).reverse().map((x) => `<li class="sub">${esc(x.line)}</li>`).join('')}</ul>` : ''}`
    + `<div class="sub">last ends:</div><ul class="list">${(j.log || []).slice(-10).reverse().map((e) => `<li class="sub">${e.ok ? '✓' : '✗'} ${esc(e.line)}</li>`).join('') || '<li class="empty">none</li>'}</ul>` : '';
  // (G2: what it knows of the others, kept by code, its role and skill, its inbox and promises)
  const so = j && j.social ? j.social : {};
  const sv = d.social || {};

/** A need's status as the Needs tab colours it (Phase N): met grey, low plain, answered green, the escalations warm. */

// ---- s43-s44's economy: members' wealth, the barter board, inventions and life goals (the agent server's economyView) ----

/** The members' wealth table, richest first (`limit`: the simple view's top rows, in a compact table). */
function wealthTable(e, limit) {

/** The flags line: which parts of the economy are on. */

/** The Economy tabs' parts (the agent server's economyView): wealth, the barter board, research, life goals; '' for one off. */

const TRAIL_KEEP = 15 * 60000, TRAIL_LENGTHS = [60000, 5 * 60000, 15 * 60000, 0];

    if (!last || Math.hypot(a.position.x - last[1], a.position.z - last[2]) > 0.5 || now - last[0] > 10000) t.push([now, Math.round(a.position.x * 10) / 10, Math.round(a.position.z * 10) / 10]);

}

 * gaps left (32 degrees from any worker at their lightness); other names by a hash, which put 7 pairs of Mayor and
 * Worker1-24 within 2 degrees.

function drawTrail(g, name, X, Z, width) {

/** Farms, pens and the mine of a village: [kind, x, z] at the middle of each (the slot's kind, a pen's animal). */
function villageIcons(v) {
  const out = [];
  const mid = (a) => [(a.x1 + a.x2 + 1) / 2, (a.z1 + a.z2 + 1) / 2];
  for (const lay of v.layouts || []) {
    if (lay.farm) out.push(['wheat', ...mid(lay.farm)]);
    for (const sl of lay.slots || []) {
      if (!sl.kind) continue;
      if (sl.annex) { const [x, z] = mid(sl); out.push(['pen', x, z]); out.push([sl.kind, x, z]); }
      else if (ICONS[sl.kind]) out.push([sl.kind, ...mid(sl)]);

  if (v.mine?.hut) out.push(['mine', ...mid(v.mine.hut)]);

// ---- G6: the foundry's request queue (scripts/foundry_requests.py, GET /api/foundry/requests): what was asked for, by whom,

let foundryReqs = null;
async function refreshFoundry() {
  if (paused) return;

const REQ_GROUPS = [
  ['waiting', 'Waiting', (r) => r.status === 'requested' && !r.blocked],
  ['building', 'Building', (r) => r.status === 'ticketed' || r.status === 'in_foundry'],
  ['landed', 'Landed', (r) => r.status === 'merged'],

  const g = REQ_GROUPS.find(([k]) => k === which) || REQ_GROUPS[0];

      <span class="sub">${(r.sources || []).map(src).join(', ')}</span>${r.blocked ? `<div class="sub">blocked: ${esc(r.blocked)}</div>` : ''}`,
    `<div class="sub mono">${esc(r.capability)}${r.ticket ? ` · ${esc(r.ticket)}` : ''}${(r.commits || []).length ? ` · ${r.commits.map(esc).join(', ')}` : ''}</div>
     <ul class="list">${(r.history || []).slice().reverse().map((h) => `<li><span class="sub">${esc(h.at)}</span> <b>${esc(h.status.replace('_', ' '))}</b> ${esc(h.why)} <span class="sub">(${esc(h.by)})</span></li>`).join('')}</ul>`);
  return card(`The foundry's requests · ${rs.filter((r) => ['requested', 'ticketed', 'in_foundry'].includes(r.status)).length} open of ${rs.length}`,

/** Level 1: the six sections, each with what asks for attention. */
function l1Html(d, v) {

    village: failed ? `<span class="badge">${failed} failed</span>` : '',

    society: trouble ? `<span class="badge warn">${plural(trouble, 'need')}</span>` : '',

}
/** Per sub-tab: a count, an alert, or "off" when its feature is off (the tab stays in its place). */
function subInfo(top, v) {
  if (top === 'village') {
    const builds = buildingStates(v), built = builds.filter(([, s]) => s === 'done').length, failed = v.tasks.filter((t) => t.status === 'failed').length;
    return { buildings: { count: builds.length ? `${built}/${builds.length}` : null }, tasks: { count: v.tasks.length, alert: failed ? `${failed} failed` : '' },
      tech: { count: Object.keys(v.tech || {}).length || null }, land: { count: (v.plots || []).length || null } };
  }
  if (top === 'society') {
    const vm = villageMind(v), ns = Object.values(v.needGauges?.kinds || {}), its = v.initiatives || [];
    const trouble = ns.filter((n) => NEED_TROUBLE.has(n.status)).length, unmet = ns.filter((n) => n.status !== 'met').length;
    return { initiatives: { count: its.length ? `${its.filter((i) => i.state === 'open').length} open` : null },
      proposals: { off: vm && vm.proposals == null ? 'off' : '' }, rules: { off: vm && vm.rules == null ? 'off' : '' },
      needs: { off: v.needGauges ? '' : 'off', count: unmet ? `${unmet} not met` : null, alert: trouble ? String(trouble) : '', warn: true }, culture: { off: 'soon' } };
  }
  if (top === 'economy') {
    const e = v.economy, m = v.market;
    const traded = m?.here ? Object.values(m.ledger || {}).reduce((t, l) => t + l.bought + l.sold, 0) : 0;
    return { market: { off: m ? '' : 'off', count: traded ? `${traded} traded` : null }, wealth: { off: e ? '' : 'off' }, board: { off: e?.board ? '' : 'off' },
      research: { off: e?.innovation ? '' : 'off' }, goals: { off: e?.flags?.goals ? '' : 'off' } };
  }
  if (top === 'run') {
    const sc = v && scorecard?.[v.name], busy = busyShare((lastData?.agents || []).map((a) => a.name));
    return { busy: { count: busy != null ? pctText(busy) : null }, scorecard: { count: sc && sc.verdict.verdict !== 'NO VERDICT' ? sc.verdict.verdict : null },
      cost: { count: lastUsage?.total ? `$${(lastUsage.total.cost ?? 0).toFixed(2)}` : null } };
  }
  return {};
}

function l2Html(d, v) {

let pickKey = '';

function render(d) {
  lastData = d;
  if (String(window.getSelection?.() ?? '')) return;
  const scrolls = [...document.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop]);
  const f = document.activeElement?.dataset || {};
  const focus = f.nav ? `a[data-nav="${CSS.escape(f.nav)}"]`
    : f.tab ? `button[data-tabkey="${CSS.escape(f.tabkey)}"][data-tab="${CSS.escape(f.tab)}"]`
    : f.act ? `button[data-act="${CSS.escape(f.act)}"][data-agent="${CSS.escape(f.agent || '')}"]`
    : 'actf' in f ? `button[data-actf="${CSS.escape(f.actf)}"][data-scope="${CSS.escape(f.scope || '')}"]` : null;
  // (the window's own scroll as well, and the refocused button without scrolling to it: a tab clicked, then the page
  // scrolled, jumped back to that tab every second, s34)
  const winY = window.scrollY;
  renderNow(d);
  for (const [k, top] of scrolls) { const el = document.querySelector(`[data-scroll="${CSS.escape(k)}"]`); if (el) el.scrollTop = top; }
  if (focus) document.querySelector(focus)?.focus({ preventScroll: true });
  if (Math.abs(window.scrollY - winY) > 1) window.scrollTo(0, winY);
}
/** Who is doing what, in the world map's corner on the full screen (each dot the agent's trail colour). */

}
/** Only the open tab is drawn: the header's village and clock, the two tab rows, the page; the overview's map row stays. */

document.addEventListener('toggle', (e) => {
  const el = e.target;
  if (!(el instanceof HTMLDetailsElement) || !el.dataset.key) return;
  const key = el.dataset.key;
  if (el.open) { openDetails.add(key); openDetails.delete('!' + key); } else { openDetails.delete(key); openDetails.add('!' + key); }
  store.set('panel.open', JSON.stringify([...openDetails]));
}, true);

document.addEventListener('click', async (e) => {
  // An activity chip (a second click on the chosen one shows all again)
  const af = e.target.closest('button[data-actf]');
  if (af) {
    actFilter = actFilter === af.dataset.actf ? '' : af.dataset.actf;
    if (lastData) render(lastData);
    return;
  }
  // A level-3 chip inside a tab (Tasks' Now/Open/Done..., Land's, Model's): it stays chosen
  const tb = e.target.closest('button[data-tab]');
  if (tb) {
    openTabs[tb.dataset.tabkey] = tb.dataset.tab;
    store.set('panel.tabs', JSON.stringify(openTabs));
    if (lastData) render(lastData);
    kick();
    return;
  }
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const name = b.dataset.agent;
  try {
    if (b.dataset.act === 'stop') await api(`/api/agents/${encodeURIComponent(name)}/stop`, { method: 'POST' });
    if (b.dataset.act === 'remove') {
      if (!confirm(`Remove ${name} from the world?`)) return;
      await api(`/api/agents/${encodeURIComponent(name)}`, { method: 'DELETE' });
    }
    if (b.dataset.act === 'watch') {
      const player = $('player').value.trim();
      if (!player) { $('player').focus(); alert('Type your Minecraft player name in "watch as" first.'); return; }
      await api('/api/watch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ player, agent: name }) });
    }
    refresh();
  } catch (err) { alert(err.message); }

// The villages' designs as last sent, and their etag: the server sends them (with their elevations) only when they changed
let designsEtag = '', designCache = new Map();
function keepDesigns(d) {
  if (!d.designsEtag) return; // (an agent server from before E.1 sends every design every time)
  if (!d.villages.length || d.villages.some((v) => 'designs' in v)) {
    designCache = new Map(d.villages.map((v) => [v.name, v.designs || {}]));
    designsEtag = d.designsEtag;
    return;
  }
  for (const v of d.villages) {
    if (!designCache.has(v.name)) designsEtag = ''; // (not expected, the etag covers the names: all of them next time)
